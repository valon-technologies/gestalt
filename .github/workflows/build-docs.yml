name: Build Docs

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-docs.yml'
      - 'docs/**'
  pull_request:
    paths:
      - '.github/workflows/build-docs.yml'
      - 'docs/**'

  workflow_dispatch:
  workflow_call:
    inputs:
      gestalt_ref:
        description: Optional commit SHA to validate.
        required: false
        type: string

permissions:
  contents: read

jobs:
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.gestalt_ref || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build current docs
        env:
          # Deployed shape: the registry serves from its own origin and
          # cross-half links are absolute (see docs/components/shell/site-bases.ts).
          NEXT_PUBLIC_REGISTRY_BASE_URL: https://registry.gestaltd.ai
          NEXT_PUBLIC_DOCS_BASE_URL: https://gestaltd.ai
        run: npm run build

      - name: Check SDK API docs publish contract
        run: npm run test:sdk-api-docs

      - name: Fetch main docs source
        run: git fetch origin main

      - name: Build versioned docs smoke site
        env:
          # Deployed shape: the registry serves from its own origin and
          # cross-half links are absolute (see docs/components/shell/site-bases.ts).
          NEXT_PUBLIC_REGISTRY_BASE_URL: https://registry.gestaltd.ai
          NEXT_PUBLIC_DOCS_BASE_URL: https://gestaltd.ai
        run: npm run build:versioned:test


      - name: Test static docs routing
        run: npm run test:registry

      - name: Test nginx docs routing
        run: npm run test:nginx-routing

      - name: Test installer
        run: npm run test:installer
