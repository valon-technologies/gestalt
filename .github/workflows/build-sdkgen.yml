name: Build sdkgen

on:
  push:
    branches:
      - main
    paths:
      - 'sdk/tools/sdkgen/**'
      - 'sdk/proto/**'
      - '.github/workflows/build-sdkgen.yml'
  pull_request:
    paths:
      - 'sdk/tools/sdkgen/**'
      - 'sdk/proto/**'
      - '.github/workflows/build-sdkgen.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdkgen:
    name: sdkgen Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/tools/sdkgen

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: sdk/tools/sdkgen/go.mod
          cache-dependency-path: sdk/tools/sdkgen/go.sum

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Install Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.66.1

      - name: Install ruff
        run: pip install ruff==0.15.14

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Verify buf pin consistency
        run: |
          pin="$(sed -n 's/^const BufVersion = "\(.*\)"$/\1/p' internal/toolchain/versions.go)"
          test -n "$pin"
          repo_root="$(git rev-parse --show-toplevel)"
          mismatches="$(grep -RhoE 'buf/cmd/buf@v[0-9][0-9.]*|buf_version="v[0-9][0-9.]*"' "$repo_root/.github/workflows" | grep -vE "@v${pin}\$|=\"v${pin}\"\$" || true)"
          if [[ -n "$mismatches" ]]; then
            echo "buf pins above do not match toolchain/versions.go (${pin})" >&2
            printf '%s\n' "$mismatches" >&2
            exit 1
          fi

      - name: Run sdkgen tests
        run: go test ./...

      - name: Verify generated output (sdkgen --check)
        run: PATH="$(go env GOPATH)/bin:$PATH" go run . --check
