name: CD (gestaltd)

# Continuous delivery for gestaltd. Re-runs the validation suite (including the
# race matrix) and publishes per-commit artifacts addressed by commit SHA: the
# CI image and alpine image to Artifact Registry, the Helm chart to the OCI chart
# repo, and cross-compiled binaries (linux + macOS) to the public CI binary
# bucket. Every CD run publishes: it is triggered by pushes to main and by manual
# dispatch for a specific commit SHA. The hourly health check (and the docs
# build smoke check) runs in ci.yml instead.

on:
  push:
    branches:
      - main
    paths:
      - '.dockerignore'
      - '.github/workflows/cd.yml'
      - '.github/workflows/validate-gestaltd.yml'
      - '.github/workflows/resolve-gestaltd-ref.yml'
      - '.github/actions/build-gestaltd-image/**'
      - 'gestaltd/**'
      - '!gestaltd/rpc/protov1/**'
  workflow_dispatch:
    inputs:
      gestalt_ref:
        description: Full commit SHA to validate, build, and publish as a CI image.
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-ref:
    uses: ./.github/workflows/resolve-gestaltd-ref.yml
    with:
      ref: ${{ inputs.gestalt_ref }}

  validate:
    uses: ./.github/workflows/validate-gestaltd.yml
    with:
      ref: ${{ inputs.gestalt_ref }}
      run-race: true
      run-e2e: true

  # Build AND publish the per-commit CI image in parallel with the validation
  # suite. This depends only on resolve-ref, so it runs alongside the Go + Helm
  # checks. Pushing the immutable sha-<commit> tag here (rather than only warming
  # a layer cache) means build-and-push below finds the image already present
  # and skips the compile entirely — eliminating the second full build that the
  # cache-warming approach failed to avoid (the COPY . . / `go build` layers did
  # not reliably cache-hit across jobs).
  #
  # Trade-off: the image lands in Artifact Registry before validation finishes.
  # It is immutable and addressed by commit SHA, so an image for a commit whose
  # tests later fail is a harmless orphan, not a promoted artifact.
  build-image:
    name: Build Toolshed Docker Image
    needs: resolve-ref
    if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - uses: ./.github/actions/build-gestaltd-image
        with:
          push: ${{ needs.resolve-ref.outputs.publish == 'true' }}
          build-alpine: 'false'
          sha: ${{ needs.resolve-ref.outputs.sha }}
          version: ${{ needs.resolve-ref.outputs.version }}
          registry-host: ${{ vars.GESTALTD_ARTIFACT_REGISTRY_HOST }}
          image-repository: ${{ vars.GESTALTD_CI_IMAGE_REPOSITORY }}
          gcp-service-account: ${{ vars.GESTALTD_CI_GCP_SERVICE_ACCOUNT }}
          gcp-workload-identity-provider: ${{ vars.GESTALTD_CI_GCP_WORKLOAD_IDENTITY_PROVIDER }}

  # Build AND publish the per-commit alpine release image (sha-<commit>-alpine)
  # in parallel with build-image and the validation suite — the multi-arch
  # (amd64 + arm64) build is the slowest publish step, so overlapping it with the
  # tests rather than waiting for them is the bigger latency win. Depends only on
  # resolve-ref. The immutable, SHA-addressed tag means an image for a commit
  # whose tests later fail is a harmless orphan, the same trade-off build-image
  # accepts. publish-alpine-image below then finds it present and short-circuits.
  build-alpine-image:
    name: Build Alpine Image
    needs: resolve-ref
    if: ${{ needs.resolve-ref.outputs.should_validate == 'true' && needs.resolve-ref.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
      - uses: ./.github/actions/build-gestaltd-alpine-image
        with:
          push: ${{ needs.resolve-ref.outputs.publish == 'true' }}
          sha: ${{ needs.resolve-ref.outputs.sha }}
          version: ${{ needs.resolve-ref.outputs.version }}
          registry-host: ${{ vars.GESTALTD_ARTIFACT_REGISTRY_HOST }}
          release-image-repository: ${{ vars.GESTALTD_RELEASE_IMAGE_REPOSITORY }}
          gcp-service-account: ${{ vars.GESTALTD_CI_GCP_SERVICE_ACCOUNT }}
          gcp-workload-identity-provider: ${{ vars.GESTALTD_CI_GCP_WORKLOAD_IDENTITY_PROVIDER }}

  # Publish the per-commit chart (0.0.0-g<sha12>) to the immutable charts repo,
  # the per-commit counterpart to release-gestaltd.yml's semver chart. Skipped if
  # the immutable version is already published (re-runs / same-commit dispatch).
  #
  # Gated only on validation, not on the image-publish jobs: the chart packages
  # YAML and consumes no output from build-and-push / publish-alpine-image, so it
  # runs in parallel with them. Trade-off: a failed image build no longer blocks
  # the chart, so a commit's chart can land without its companion images.
  publish-chart:
    name: Publish Helm Chart to GCP AR
    needs: [resolve-ref, validate]
    if: ${{ needs.resolve-ref.result == 'success' && needs.validate.result == 'success' && needs.resolve-ref.outputs.should_validate == 'true' && needs.resolve-ref.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GESTALTD_CI_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GESTALTD_CI_GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Package and push Helm chart by commit SHA
        env:
          SHA: ${{ needs.resolve-ref.outputs.sha }}
          ARTIFACT_REGISTRY_HOST: ${{ vars.GESTALTD_ARTIFACT_REGISTRY_HOST }}
          CHART_REPOSITORY: ${{ vars.GESTALTD_CHART_REPOSITORY }}
        run: |
          sha_version="0.0.0-g${SHA:0:12}"
          echo "${{ steps.gcp-auth.outputs.access_token }}" | helm registry login "${ARTIFACT_REGISTRY_HOST}" --username oauth2accesstoken --password-stdin
          if helm show chart "${CHART_REPOSITORY}/gestaltd" --version "${sha_version}" >/dev/null 2>&1; then
            echo "Chart ${sha_version} already published; skipping."
            exit 0
          fi
          helm package gestaltd/deploy/helm/gestaltd \
            --version "${sha_version}" \
            --app-version "${SHA}" \
            --destination /tmp/charts
          helm push "/tmp/charts/gestaltd-${sha_version}.tgz" "${CHART_REPOSITORY}"

  # Publish per-commit gestaltd binaries (linux + macOS, amd64 + arm64) to the
  # public CI binary bucket, addressed by commit SHA — the per-commit counterpart
  # to release-gestaltd.yml's semver release tarballs, and the only SHA-addressed
  # artifact that ships a native macOS binary (the CI and alpine images are
  # linux-only). Toolshed's app-packaging workflow pulls these by SHA.
  #
  # Gated on validation like publish-chart, since these feed production app
  # packaging. Reuses the CI image publisher SA, which can write the bucket.
  publish-binaries:
    name: Publish gestaltd Binaries to GCS
    needs: [resolve-ref, validate]
    if: ${{ needs.resolve-ref.result == 'success' && needs.validate.result == 'success' && needs.resolve-ref.outputs.should_validate == 'true' && needs.resolve-ref.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum
      - name: Cache Go build cache (cross-compiled binaries)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-gestaltd-publish-binaries-go-${{ hashFiles('gestaltd/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gestaltd-publish-binaries-go-
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GESTALTD_CI_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GESTALTD_CI_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Build, package, and upload binaries by commit SHA
        env:
          SHA: ${{ needs.resolve-ref.outputs.sha }}
          VERSION: ${{ needs.resolve-ref.outputs.version }}
          BUCKET: ${{ vars.GESTALTD_CI_BINARY_BUCKET }}
        run: |
          set -euo pipefail
          : "${BUCKET:?GESTALTD_CI_BINARY_BUCKET repository variable is required}"

          dest="gs://${BUCKET}/gestaltd/sha-${SHA}"
          # goos/goarch/suffix; suffixes match release-gestaltd.yml's naming.
          platforms=(
            "darwin/arm64/macos-arm64"
            "darwin/amd64/macos-x86_64"
            "linux/amd64/linux-x86_64"
            "linux/arm64/linux-arm64"
          )

          mkdir -p build dist
          for entry in "${platforms[@]}"; do
            IFS=/ read -r goos goarch suffix <<<"${entry}"
            asset="gestaltd-${suffix}.tar.gz"

            # Upload each object only when it is absent: objectCreator cannot
            # overwrite, so re-uploading an existing object would 403. This also
            # makes a partial prior run (tarball uploaded, checksum not) self-heal.
            has_tarball=false
            has_sha=false
            gcloud storage ls "${dest}/${asset}" >/dev/null 2>&1 && has_tarball=true
            gcloud storage ls "${dest}/${asset}.sha256" >/dev/null 2>&1 && has_sha=true

            if [[ "${has_tarball}" == true && "${has_sha}" == true ]]; then
              echo "${asset} (+ checksum) already published for ${SHA}; skipping."
              continue
            fi

            # A published checksum with no tarball is an orphaned, inconsistent
            # state: we cannot republish a matching tarball without overwriting the
            # stale checksum, which objectCreator cannot do. Fail loudly rather than
            # upload a fresh archive whose bytes disagree with the stored checksum.
            if [[ "${has_sha}" == true ]]; then
              echo "Orphaned ${asset}.sha256 for ${SHA}: checksum is published but the tarball is missing." >&2
              echo "Remove the stale checksum and re-run; objectCreator cannot overwrite it in place." >&2
              exit 1
            fi

            # has_sha is false here, so the checksum is always (re)derived from the
            # authoritative tarball bytes below and uploaded — never left to disagree.
            if [[ "${has_tarball}" == true ]]; then
              # Checksum the published bytes, not a rebuild: gzip records an mtime,
              # so a fresh archive would not be identical to the stored one.
              gcloud storage cp "${dest}/${asset}" "dist/${asset}"
            else
              (
                cd gestaltd
                CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
                  -ldflags "-X main.version=${VERSION}" \
                  -o "${GITHUB_WORKSPACE}/build/gestaltd" \
                  ./cmd/gestaltd
              )
              tar -czf "dist/${asset}" -C build gestaltd
              gcloud storage cp "dist/${asset}" "${dest}/${asset}"
              rm -f build/gestaltd
            fi

            # Bare filename so `sha256sum -c` works after download.
            (cd dist && shasum -a 256 "${asset}" > "${asset}.sha256")
            gcloud storage cp "dist/${asset}.sha256" "${dest}/${asset}.sha256"
          done

  # Post-validation gate for the alpine release image. By now build-alpine-image
  # has already pushed the immutable sha-<commit>-alpine image, so the action's
  # existing-image check short-circuits — it skips the multi-arch build + push.
  #
  # build-alpine-image is in `needs` only to order this after it, not to gate on
  # its success: if its push failed, this job must still be able to build + push
  # the image the tests have cleared. The `if` therefore gates on validate +
  # resolve-ref succeeding (not on build-alpine-image) and uses !cancelled() so a
  # failed build-alpine-image still lets this run — it just falls back to a full
  # multi-arch build + push. Runs in parallel with build-and-push and publish-chart.
  publish-alpine-image:
    name: Publish Alpine Docker Image to GCP AR
    needs: [resolve-ref, validate, build-alpine-image]
    if: ${{ !cancelled() && needs.resolve-ref.result == 'success' && needs.validate.result == 'success' && needs.resolve-ref.outputs.should_validate == 'true' && needs.resolve-ref.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
      - uses: ./.github/actions/build-gestaltd-alpine-image
        with:
          push: ${{ needs.resolve-ref.outputs.publish == 'true' }}
          sha: ${{ needs.resolve-ref.outputs.sha }}
          version: ${{ needs.resolve-ref.outputs.version }}
          registry-host: ${{ vars.GESTALTD_ARTIFACT_REGISTRY_HOST }}
          release-image-repository: ${{ vars.GESTALTD_RELEASE_IMAGE_REPOSITORY }}
          gcp-service-account: ${{ vars.GESTALTD_CI_GCP_SERVICE_ACCOUNT }}
          gcp-workload-identity-provider: ${{ vars.GESTALTD_CI_GCP_WORKLOAD_IDENTITY_PROVIDER }}

  # Runs only after validation passes. By now build-image has already pushed the
  # immutable sha-<commit> image, so the build action's existing-image check
  # short-circuits: it skips the build + push and just smoke-tests the published
  # image. This is the post-validation gate and final verification.
  #
  # build-image is in `needs` only to order this after it, not to gate on its
  # success: if its push failed, this job must still be able to build + push the
  # image the tests have cleared. The `if` therefore gates on validate +
  # resolve-ref succeeding (not on build-image) and uses !cancelled() so a failed
  # build-image still lets this run — it just falls back to a full build + push.
  build-and-push:
    name: Publish Toolshed Docker Image to GCP AR
    needs: [resolve-ref, validate, build-image]
    if: ${{ !cancelled() && needs.resolve-ref.result == 'success' && needs.validate.result == 'success' && needs.resolve-ref.outputs.should_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - uses: ./.github/actions/build-gestaltd-image
        with:
          push: ${{ needs.resolve-ref.outputs.publish == 'true' }}
          build-alpine: 'false'
          sha: ${{ needs.resolve-ref.outputs.sha }}
          version: ${{ needs.resolve-ref.outputs.version }}
          registry-host: ${{ vars.GESTALTD_ARTIFACT_REGISTRY_HOST }}
          image-repository: ${{ vars.GESTALTD_CI_IMAGE_REPOSITORY }}
          gcp-service-account: ${{ vars.GESTALTD_CI_GCP_SERVICE_ACCOUNT }}
          gcp-workload-identity-provider: ${{ vars.GESTALTD_CI_GCP_WORKLOAD_IDENTITY_PROVIDER }}
