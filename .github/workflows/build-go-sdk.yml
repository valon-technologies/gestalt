name: Build Go SDK

on:
  push:
    branches:
      - main
    paths:
      - 'sdk/go/**'
      - 'sdk/proto/**'
      - '.github/workflows/build-go-sdk.yml'
  pull_request:
    paths:
      - 'sdk/go/**'
      - 'sdk/proto/**'
      - '.github/workflows/build-go-sdk.yml'

  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  go-sdk:
    name: Go SDK Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/go

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum

      - name: Install Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.66.1

      - name: Verify checked-in generated bindings
        run: |
          repo_root="$(git rev-parse --show-toplevel)"
          cd "$repo_root/sdk/proto"
          "$(go env GOPATH)/bin/buf" generate --template buf.go.sdk.gen.yaml
          cd "$repo_root"
          git diff --exit-code -- gestaltd/rpc/protov1/v1/*.pb.go gestaltd/rpc/protov1/v1/*_grpc.pb.go

      - name: Run Go SDK checks
        run: go test ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11.3
          working-directory: sdk/go
          verify: false
          skip-cache: true
