name: Build Go SDK

on:
  push:
    branches:
      - main
    paths:
      - 'sdk/go/**'
      - 'sdk/proto/**'
      - '.github/workflows/build-go-sdk.yml'
  pull_request:
    paths:
      - 'sdk/go/**'
      - 'sdk/proto/**'
      - '.github/workflows/build-go-sdk.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-sdk:
    name: Go SDK Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/go

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum

      - name: Install Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.66.1

      - name: Verify checked-in generated bindings
        run: |
          repo_root="$(git rev-parse --show-toplevel)"
          cd "$repo_root/sdk/proto"
          "$(go env GOPATH)/bin/buf" generate --template buf.go.sdk.gen.yaml
          cd "$repo_root"
          go run ./sdk/go/gen/v1/generate_aliases.go ./sdk/go/internal/gen/v1 ./sdk/go/gen/v1/aliases.go
          git diff --exit-code -- sdk/go/internal/gen/v1/*.pb.go sdk/go/internal/gen/v1/*_grpc.pb.go sdk/go/gen/v1/aliases.go

      - name: Run Go SDK checks
        run: go test ./...
