name: Deploy Gestalt Docs

on:
  push:
    branches: [main]
    tags:
      - 'gestaltd/v*'
    paths:
      - 'docs/**'
      - 'sdk/python/**'
      - 'sdk/typescript/**'
      - '.github/workflows/deploy-gestalt-docs.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.DOCS_SERVICE_NAME }}
  DNS_PROJECT_ID: ${{ secrets.DOCS_DNS_PROJECT_ID }}
  TERRAFORM_STATE_BUCKET: ${{ secrets.DOCS_TERRAFORM_STATE_BUCKET }}
  TERRAFORM_STATE_PREFIX: ${{ vars.DOCS_TERRAFORM_STATE_PREFIX }}
  DOCS_RESOURCE_PREFIX: ${{ vars.DOCS_RESOURCE_PREFIX }}
  WIF_POOL_ID: ${{ vars.GCP_WIF_POOL_ID }}
  WIF_PROVIDER_ID: ${{ vars.GCP_WIF_PROVIDER_ID }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/${{ vars.DOCS_SERVICE_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.10"
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python
        run: uv python install 3.10

      - name: Sync Python SDK docs environment
        working-directory: sdk/python
        run: uv sync --frozen --group dev

      - name: Build Python SDK API docs
        working-directory: sdk/python
        run: |
          rm -rf ../../docs/public/api/python
          uv run sphinx-build -W -b html -d docs/_build/deploy-doctrees docs ../../docs/public/api/python

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: bun install --frozen-lockfile

      - name: Build TypeScript client package
        working-directory: sdk/typescript
        run: bun run build:client

      - name: Build TypeScript API docs
        working-directory: sdk/typescript
        run: |
          rm -rf ../../docs/public/api/typescript
          bun run docs:build:deploy

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build current docs
        working-directory: docs
        env:
          # Deployed shape: the registry serves from its own origin and
          # cross-half links are absolute (see docs/components/shell/site-bases.ts).
          NEXT_PUBLIC_REGISTRY_BASE_URL: https://registry.gestaltd.ai
          NEXT_PUBLIC_DOCS_BASE_URL: https://gestaltd.ai
        run: npm run build

      - name: Fetch main docs source
        run: git fetch origin main

      - name: Build versioned docs
        working-directory: docs
        env:
          # Deployed shape: the registry serves from its own origin and
          # cross-half links are absolute (see docs/components/shell/site-bases.ts).
          NEXT_PUBLIC_REGISTRY_BASE_URL: https://registry.gestaltd.ai
          NEXT_PUBLIC_DOCS_BASE_URL: https://gestaltd.ai
        run: npm run build:versioned

      - name: Test static docs routing
        working-directory: docs
        run: npm run test:registry

      - name: Test nginx docs routing
        working-directory: docs
        run: npm run test:nginx-routing

      - name: Test registry docs rendering
        working-directory: docs
        run: npm run test:registry-docs

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_PROVIDER_ID }}
          service_account: github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Authenticate to Artifact Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docs
          file: docs/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # No layer cache: the image is one COPY of a freshly built out/
          # that changes every deploy, so a layer cache never hits.

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Terraform Init
        working-directory: docs/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="prefix=${{ env.TERRAFORM_STATE_PREFIX }}"

      - name: Terraform Apply
        working-directory: docs/terraform
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_project_number: ${{ secrets.GCP_PROJECT_NUMBER }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_dns_project_id: ${{ env.DNS_PROJECT_ID }}
          TF_VAR_resource_prefix: ${{ env.DOCS_RESOURCE_PREFIX }}
          TF_VAR_wif_pool_id: ${{ env.WIF_POOL_ID }}
        run: |
          terraform apply -auto-approve \
            -var='docs_image=${{ env.IMAGE }}:${{ github.sha }}'
