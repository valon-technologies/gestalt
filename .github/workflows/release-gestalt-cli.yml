name: Release Gestalt CLI

on:
  push:
    tags:
      - 'gestalt/v*'

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify Release Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Verify Cargo version matches tag
        working-directory: gestalt
        run: |
          expected="${GITHUB_REF_NAME#gestalt/v}"
          actual="$(
            cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="gestalt") | .version'
          )"
          if [ "$actual" != "$expected" ]; then
            echo "gestalt Cargo version $actual does not match release tag $expected" >&2
            exit 1
          fi

  build:
    needs: verify-version
    uses: ./.github/workflows/rust-build-matrix.yml
    with:
      working-directory: gestalt
      binary-name: gestalt
      artifact-prefix: gestalt
      run-tests: true
      package: true
      bundle-gestaltd: false

  release:
    name: Publish Release
    needs: build
    uses: ./.github/workflows/publish-scoped-github-release.yml
    with:
      component-name: gestalt
      version-prefix: 'gestalt/v'
      tag-glob: 'gestalt/v*'
      path-filters: |
        gestalt
      component-summary: |
        Command-line client for authenticating with Gestalt, working with integrations and workflows, and running interactive agent sessions from the terminal.
      install-markdown: |
        - Installer: `curl -fsSL https://gestaltd.ai/install-gestalt.sh | sh -s -- --version ${version}`
        - Homebrew: `brew upgrade valon-technologies/gestalt/gestalt`
        - Docs: [CLI guide](https://gestaltd.ai/client/cli)
      exclude-subject-patterns: |
        ^Update gestalt formula to v
      download-artifact-pattern: 'gestalt-*'

  publish-docker:
    name: Publish Docker Image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_NAME: valontechnologies/gestalt
      IMAGE_SOURCE: https://github.com/${{ github.repository }}
      IMAGE_DOCUMENTATION: https://gestaltd.ai/client/cli/docker
      IMAGE_URL: https://hub.docker.com/r/valontechnologies/gestalt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download Linux release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: gestalt-linux-*
          path: dist
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#gestalt/v}" >> "$GITHUB_OUTPUT"

      - name: Compute image metadata
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build and push image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: gestalt/Dockerfile
          target: distroless
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            GESTALT_VERSION=${{ steps.version.outputs.version }}
            GESTALT_REVISION=${{ github.sha }}
            GESTALT_CREATED=${{ steps.meta.outputs.created }}
            GESTALT_SOURCE=${{ env.IMAGE_SOURCE }}
            GESTALT_DOCUMENTATION=${{ env.IMAGE_DOCUMENTATION }}
            GESTALT_URL=${{ env.IMAGE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          sbom: true
          provenance: mode=max

  update-formula:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate release bot token
        id: release-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GESTALT_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GESTALT_RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            gestalt
            homebrew-gestalt
          permission-contents: write

      - name: Checkout repository main branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          token: ${{ steps.release-bot-token.outputs.token }}

      - name: Checkout Homebrew tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: valon-technologies/homebrew-gestalt
          ref: main
          token: ${{ steps.release-bot-token.outputs.token }}
          path: homebrew-tap

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#gestalt/v}" >> "$GITHUB_OUTPUT"

      - name: Download SHA256 files from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p checksums
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.sha256" \
            --dir checksums

      - name: Parse checksums
        id: checksums
        run: |
          {
            echo "macos_arm64=$(awk '{print $1}' checksums/gestalt-macos-arm64.tar.gz.sha256)"
            echo "macos_x86_64=$(awk '{print $1}' checksums/gestalt-macos-x86_64.tar.gz.sha256)"
            echo "linux_arm64=$(awk '{print $1}' checksums/gestalt-linux-arm64.tar.gz.sha256)"
            echo "linux_x86_64=$(awk '{print $1}' checksums/gestalt-linux-x86_64.tar.gz.sha256)"
          } >> "$GITHUB_OUTPUT"

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          SHA_MACOS_ARM64: ${{ steps.checksums.outputs.macos_arm64 }}
          SHA_MACOS_X86_64: ${{ steps.checksums.outputs.macos_x86_64 }}
          SHA_LINUX_ARM64: ${{ steps.checksums.outputs.linux_arm64 }}
          SHA_LINUX_X86_64: ${{ steps.checksums.outputs.linux_x86_64 }}
        run: |
          FORMULAS=(
            "Formula/gestalt.rb"
            "homebrew-tap/Formula/gestalt.rb"
          )

          for formula in "${FORMULAS[@]}"; do
            old_version=$(grep '^\s*version ' "$formula" | sed 's/.*version "\(.*\)"/\1/')

            sed -i "s/version \"${old_version}\"/version \"${VERSION}\"/" "$formula"
            perl -0pi -e 's/bin\.install "gestalt"(?:, "gestaltd")?/bin.install "gestalt"/' "$formula"
            perl -0pi -e 's{https://github.com/valon-technologies/gestalt/releases/download/[^"]+/gestalt-macos-arm64\.tar\.gz}{https://github.com/valon-technologies/gestalt/releases/download/'"$TAG"'/gestalt-macos-arm64.tar.gz}g; s{https://github.com/valon-technologies/gestalt/releases/download/[^"]+/gestalt-macos-x86_64\.tar\.gz}{https://github.com/valon-technologies/gestalt/releases/download/'"$TAG"'/gestalt-macos-x86_64.tar.gz}g; s{https://github.com/valon-technologies/gestalt/releases/download/[^"]+/gestalt-linux-arm64(?:-musl)?\.tar\.gz}{https://github.com/valon-technologies/gestalt/releases/download/'"$TAG"'/gestalt-linux-arm64.tar.gz}g; s{https://github.com/valon-technologies/gestalt/releases/download/[^"]+/gestalt-linux-x86_64(?:-musl)?\.tar\.gz}{https://github.com/valon-technologies/gestalt/releases/download/'"$TAG"'/gestalt-linux-x86_64.tar.gz}g' "$formula"

            awk -v sha_macos_arm64="$SHA_MACOS_ARM64" \
                -v sha_macos_x86_64="$SHA_MACOS_X86_64" \
                -v sha_linux_arm64="$SHA_LINUX_ARM64" \
                -v sha_linux_x86_64="$SHA_LINUX_X86_64" \
            '
            /gestalt-macos-arm64\.tar\.gz/ { found="macos-arm64" }
            /gestalt-macos-x86_64\.tar\.gz/ { found="macos-x86_64" }
            /gestalt-linux-arm64\.tar\.gz/ { found="linux-arm64" }
            /gestalt-linux-x86_64\.tar\.gz/ { found="linux-x86_64" }
            /sha256 "/ {
              if (found == "macos-arm64") { sub(/"[^"]*"/, "\"" sha_macos_arm64 "\"") }
              if (found == "macos-x86_64") { sub(/"[^"]*"/, "\"" sha_macos_x86_64 "\"") }
              if (found == "linux-arm64") { sub(/"[^"]*"/, "\"" sha_linux_arm64 "\"") }
              if (found == "linux-x86_64") { sub(/"[^"]*"/, "\"" sha_linux_x86_64 "\"") }
              found=""
            }
            { print }
            ' "$formula" > "${formula}.tmp" && mv "${formula}.tmp" "$formula"
          done

      - name: Verify formula was updated
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for formula in Formula/gestalt.rb homebrew-tap/Formula/gestalt.rb; do
            echo "=== ${formula} ==="
            cat "$formula"
            echo ""
            grep -q "version \"${VERSION}\"" "$formula" || { echo "ERROR: version not updated in ${formula}"; exit 1; }
            grep -q 'bin.install "gestalt"$' "$formula" || { echo "ERROR: gestalt install line not updated in ${formula}"; exit 1; }
            ! grep -q 'bin.install "gestalt", "gestaltd"' "$formula" || { echo "ERROR: gestaltd helper should not be installed in ${formula}"; exit 1; }
            grep -q "PLACEHOLDER" "$formula" && { echo "ERROR: PLACEHOLDER still present in ${formula}"; exit 1; }
          done
          echo "Formula verified successfully"

      - name: Commit and push repository formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gestalt.rb
          git diff --cached --quiet && { echo "No repository formula changes to commit"; exit 0; }
          git commit -m "Update gestalt formula to v${{ steps.version.outputs.version }}"
          git pull --rebase origin main
          git push

      - name: Commit and push Homebrew tap
        run: |
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/gestalt.rb
          git -C homebrew-tap diff --cached --quiet && { echo "No Homebrew tap changes to commit"; exit 0; }
          git -C homebrew-tap commit -m "Update gestalt formula to v${{ steps.version.outputs.version }}"
          git -C homebrew-tap pull --rebase origin main
          git -C homebrew-tap push
