name: Build Gestaltd

on:
  push:
    branches:
      - main
  pull_request:

  workflow_dispatch:
    inputs:
      gestalt_ref:
        description: Optional full commit SHA to validate, build, and publish as a CI artifact.
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-ref:
    name: Resolve Build Ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve commit
        id: resolve
        env:
          REQUESTED_GESTALT_REF: ${{ github.event.inputs.gestalt_ref || '' }}
        run: |
          set -euo pipefail

          requested_ref="${REQUESTED_GESTALT_REF}"
          if [[ -n "${requested_ref}" && ! "${requested_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "gestalt_ref must be a full lowercase 40-character commit SHA." >&2
            exit 1
          fi

          ref="${requested_ref:-${GITHUB_SHA}}"
          sha="$(git rev-parse "${ref}^{commit}")"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved ref '${ref}' to invalid commit '${sha}'." >&2
            exit 1
          fi

          publish="false"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            publish="true"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${requested_ref}" ]]; then
            publish="true"
          fi

          {
            echo "sha=${sha}"
            echo "publish=${publish}"
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}+g${sha:0:12}"
          } >> "${GITHUB_OUTPUT}"

  lint:
    name: Go Lint & Vet
    needs: resolve-ref
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.gestalt_ref == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gestaltd

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Install Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.66.1

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify checked-in generated bindings
        run: |
          repo_root="$(git rev-parse --show-toplevel)"
          cd "$repo_root/sdk/proto"
          "$(go env GOPATH)/bin/buf" generate --template buf.go.server.gen.yaml
          cd "$repo_root"
          git diff --exit-code -- gestaltd/internal/gen/v1/*.pb.go gestaltd/internal/gen/v1/*_grpc.pb.go

      - name: Check generated proto package split
        run: |
          repo_root="$(git rev-parse --show-toplevel)"
          bash "$repo_root/.github/scripts/check-go-proto-split.sh" "$repo_root/gestaltd"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11.3
          working-directory: gestaltd
          verify: false
          skip-cache: true

  test:
    name: Go Tests
    needs: resolve-ref
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.gestalt_ref == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gestaltd

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Run tests
        run: go test ./...

  coverage:
    name: Go Coverage
    needs: resolve-ref
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.gestalt_ref == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gestaltd

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Run coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: gestaltd/coverage.out
          fail_ci_if_error: false

  race:
    name: Go Race Tests
    needs: resolve-ref
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.gestalt_ref == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gestaltd

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Run race tests
        run: go test -race -timeout=15m ./...

  docs-build:
    name: Docs Build
    needs: resolve-ref
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.gestalt_ref == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build current docs
        run: npm run build

      - name: Check SDK docs
        run: npm run test:sdk-docs

      - name: Check SDK API docs publish contract
        run: npm run test:sdk-api-docs

      - name: Fetch main docs source
        run: git fetch origin main --tags

      - name: Build versioned docs smoke site
        run: npm run build:versioned:test

      - name: Test static docs routing
        run: npm run test:registry

      - name: Test nginx docs routing
        run: npm run test:nginx-routing

      - name: Test installer
        run: npm run test:installer

  helm-validate:
    name: Helm Chart Validation
    needs: resolve-ref
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.gestalt_ref == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Helm lint
        run: helm lint gestaltd/deploy/helm/gestaltd

      - name: Helm template (default chart profile)
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            > /tmp/rendered-default.yaml

      - name: Helm template (ingress)
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            --set ingress.enabled=true \
            --set-string ingress.hosts[0].host=gestalt.example.com \
            --set-string ingress.hosts[0].paths[0].path=/gestalt \
            --set-string ingress.hosts[0].paths[0].pathType=Prefix \
            > /tmp/rendered-ingress.yaml

      - name: Helm template
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            -f gestaltd/deploy/helm/gestaltd/ci-values.yaml \
            > /tmp/rendered.yaml

      - name: Install kubeconform
        run: |
          set -euo pipefail
          version="v0.7.0"
          archive="kubeconform-linux-amd64.tar.gz"
          checksum="c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
          tmp_dir="$(mktemp -d)"
          archive_path="${tmp_dir}/${archive}"

          trap 'rm -rf "${tmp_dir}"' EXIT

          curl -fsSLo "${archive_path}" \
            "https://github.com/yannh/kubeconform/releases/download/${version}/${archive}"
          actual_checksum="$(sha256sum "${archive_path}" | awk '{print $1}')"
          if [ "${actual_checksum}" != "${checksum}" ]; then
            echo "Checksum mismatch for ${archive}: ${actual_checksum}" >&2
            exit 1
          fi
          tar xzf "${archive_path}" -C /usr/local/bin kubeconform

      - name: Validate Kubernetes schemas
        run: kubeconform -strict -summary /tmp/rendered.yaml

      - name: Validate Kubernetes schemas (default chart profile)
        run: kubeconform -strict -summary /tmp/rendered-default.yaml

      - name: Validate Kubernetes schemas (ingress)
        run: kubeconform -strict -summary /tmp/rendered-ingress.yaml

      - name: Helm template (preparation)
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            -f gestaltd/deploy/helm/gestaltd/ci-values-preparation.yaml \
            > /tmp/rendered-preparation.yaml

      - name: Validate Kubernetes schemas (preparation)
        run: kubeconform -strict -summary /tmp/rendered-preparation.yaml

  docker-build:
    name: Docker Image Build
    needs: resolve-ref
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.gestalt_ref == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Build static image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --file gestaltd/Dockerfile \
            --target static \
            --build-arg GESTALT_VERSION=ci \
            --tag gestaltd:ci-static \
            .

      - name: Build Alpine image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --file gestaltd/Dockerfile \
            --target alpine \
            --build-arg GESTALT_VERSION=ci \
            --tag gestaltd:ci-alpine \
            .

  publish-ci-artifact:
    name: Publish CI Artifact
    needs: [resolve-ref, lint, test, coverage, race, docs-build, helm-validate, docker-build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.resolve-ref.outputs.publish == 'true' && vars.GESTALTD_CI_ARTIFACT_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: workflow

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          path: source

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: source/gestaltd/go.mod
          cache-dependency-path: source/gestaltd/go.sum

      - name: Validate artifact configuration
        env:
          GESTALTD_CI_ARTIFACT_BUCKET: ${{ vars.GESTALTD_CI_ARTIFACT_BUCKET }}
          GESTALTD_CI_ARTIFACT_BASE_URL: ${{ vars.GESTALTD_CI_ARTIFACT_BASE_URL }}
        run: |
          set -euo pipefail
          : "${GESTALTD_CI_ARTIFACT_BUCKET:?GESTALTD_CI_ARTIFACT_BUCKET repository variable is required}"
          : "${GESTALTD_CI_ARTIFACT_BASE_URL:?GESTALTD_CI_ARTIFACT_BASE_URL repository variable is required}"

      - name: Build CI artifact
        env:
          GESTALTD_ARTIFACT_BASE_URL: ${{ vars.GESTALTD_CI_ARTIFACT_BASE_URL }}/${{ needs.resolve-ref.outputs.sha }}
          GESTALTD_COMMIT: ${{ needs.resolve-ref.outputs.sha }}
          GESTALTD_OUTPUT_DIR: ${{ github.workspace }}/dist/gestaltd-ci
          GESTALTD_SOURCE_DIR: ${{ github.workspace }}/source
          GESTALTD_VERSION: ${{ needs.resolve-ref.outputs.version }}
        run: workflow/.github/scripts/build-gestaltd-ci-artifact.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GESTALTD_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GESTALTD_CI_GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Upload immutable artifact
        env:
          GESTALTD_CI_ARTIFACT_BUCKET: ${{ vars.GESTALTD_CI_ARTIFACT_BUCKET }}
          GESTALTD_COMMIT: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail

          artifact_prefix="gs://${GESTALTD_CI_ARTIFACT_BUCKET}/github.com/valon-technologies/gestalt/${GESTALTD_COMMIT}"
          for artifact in \
            gestaltd-linux-x86_64.tar.gz \
            gestaltd-linux-x86_64.tar.gz.sha256 \
            metadata.json
          do
            gcloud storage cp \
              --if-generation-match=0 \
              "dist/gestaltd-ci/${artifact}" \
              "${artifact_prefix}/${artifact}"
          done

  backfill-ci-artifact:
    name: Backfill CI Artifact
    needs: resolve-ref
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.gestalt_ref != '' && vars.GESTALTD_CI_ARTIFACT_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: workflow

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          path: source

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: source/gestaltd/go.mod
          cache-dependency-path: source/gestaltd/go.sum

      - name: Validate artifact configuration
        env:
          GESTALTD_CI_ARTIFACT_BUCKET: ${{ vars.GESTALTD_CI_ARTIFACT_BUCKET }}
          GESTALTD_CI_ARTIFACT_BASE_URL: ${{ vars.GESTALTD_CI_ARTIFACT_BASE_URL }}
        run: |
          set -euo pipefail
          : "${GESTALTD_CI_ARTIFACT_BUCKET:?GESTALTD_CI_ARTIFACT_BUCKET repository variable is required}"
          : "${GESTALTD_CI_ARTIFACT_BASE_URL:?GESTALTD_CI_ARTIFACT_BASE_URL repository variable is required}"

      - name: Build CI artifact
        env:
          GESTALTD_ARTIFACT_BASE_URL: ${{ vars.GESTALTD_CI_ARTIFACT_BASE_URL }}/${{ needs.resolve-ref.outputs.sha }}
          GESTALTD_COMMIT: ${{ needs.resolve-ref.outputs.sha }}
          GESTALTD_OUTPUT_DIR: ${{ github.workspace }}/dist/gestaltd-ci
          GESTALTD_SOURCE_DIR: ${{ github.workspace }}/source
          GESTALTD_VERSION: ${{ needs.resolve-ref.outputs.version }}
        run: workflow/.github/scripts/build-gestaltd-ci-artifact.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GESTALTD_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GESTALTD_CI_GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Upload immutable artifact
        env:
          GESTALTD_CI_ARTIFACT_BUCKET: ${{ vars.GESTALTD_CI_ARTIFACT_BUCKET }}
          GESTALTD_COMMIT: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail

          artifact_prefix="gs://${GESTALTD_CI_ARTIFACT_BUCKET}/github.com/valon-technologies/gestalt/${GESTALTD_COMMIT}"
          for artifact in \
            gestaltd-linux-x86_64.tar.gz \
            gestaltd-linux-x86_64.tar.gz.sha256 \
            metadata.json
          do
            gcloud storage cp \
              --if-generation-match=0 \
              "dist/gestaltd-ci/${artifact}" \
              "${artifact_prefix}/${artifact}"
          done
