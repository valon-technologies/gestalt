name: Build Gestaltd

on:
  push:
    branches:
      - main
    paths:
      - '.dockerignore'
      - '.github/workflows/build-gestaltd.yml'
      - 'gestaltd/**'
      - '!gestaltd/rpc/protov1/**'
  pull_request:

  workflow_dispatch:
    inputs:
      gestalt_ref:
        description: Optional full commit SHA to validate, build, and publish as a CI image.
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-ref:
    name: Resolve Build Ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      sha: ${{ steps.resolve.outputs.sha }}
      should_validate: ${{ steps.resolve.outputs.should_validate }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Resolve commit
        id: resolve
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          REQUESTED_GESTALT_REF: ${{ github.event.inputs.gestalt_ref || '' }}
        run: |
          set -euo pipefail

          requested_ref="${REQUESTED_GESTALT_REF}"
          if [[ -n "${requested_ref}" && ! "${requested_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "gestalt_ref must be a full lowercase 40-character commit SHA." >&2
            exit 1
          fi

          ref="${requested_ref:-${GITHUB_SHA}}"
          sha="$(git rev-parse "${ref}^{commit}")"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved ref '${ref}' to invalid commit '${sha}'." >&2
            exit 1
          fi

          publish="false"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            publish="true"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${requested_ref}" ]]; then
            publish="true"
          fi

          should_validate="true"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            validate_exact_paths=(
              ".dockerignore"
              ".github/workflows/build-gestaltd.yml"
            )
            validate_path_prefixes=(
              "gestaltd/"
            )
            ignore_path_prefixes=(
              "gestaltd/rpc/protov1/"
            )

            should_validate="false"
            base_sha="${PULL_REQUEST_BASE_SHA}"
            head_sha="${PULL_REQUEST_HEAD_SHA:-${sha}}"

            if [[ -z "${base_sha}" ]]; then
              echo "Pull request base SHA is unavailable; running Gestaltd validation." >&2
              should_validate="true"
            elif changed_files="$(git diff --name-only "${base_sha}" "${head_sha}")"; then
              while IFS= read -r changed_file; do
                for ignored_prefix in "${ignore_path_prefixes[@]}"; do
                  if [[ "${changed_file}" == "${ignored_prefix}"* ]]; then
                    continue 2
                  fi
                done

                for exact_path in "${validate_exact_paths[@]}"; do
                  if [[ "${changed_file}" == "${exact_path}" ]]; then
                    should_validate="true"
                    break
                  fi
                done
                if [[ "${should_validate}" == "true" ]]; then
                  break
                fi

                for path_prefix in "${validate_path_prefixes[@]}"; do
                  if [[ "${changed_file}" == "${path_prefix}"* ]]; then
                    should_validate="true"
                    break
                  fi
                done
                if [[ "${should_validate}" == "true" ]]; then
                  break
                fi
              done <<< "${changed_files}"
            else
              echo "Unable to diff pull request files; running Gestaltd validation." >&2
              should_validate="true"
            fi
          fi

          {
            echo "sha=${sha}"
            echo "publish=${publish}"
            echo "should_validate=${should_validate}"
            echo "version=0.0.0-ci+g${sha:0:12}"
          } >> "${GITHUB_OUTPUT}"

  lint:
    name: Go Lint & Vet
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Skip irrelevant changes
        if: ${{ needs.resolve-ref.outputs.should_validate == 'false' }}
        run: echo "No Gestaltd-related changes detected; required check satisfied."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Install Buf
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        working-directory: gestaltd
        run: go install github.com/bufbuild/buf/cmd/buf@v1.66.1

      - name: Check go mod tidy
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        working-directory: gestaltd
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify checked-in generated bindings
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          repo_root="$(git rev-parse --show-toplevel)"
          cd "$repo_root/sdk/proto"
          "$(go env GOPATH)/bin/buf" generate --template buf.go.server.gen.yaml
          cd "$repo_root"
          git diff --exit-code -- gestaltd/rpc/protov1/v1/*.pb.go gestaltd/rpc/protov1/v1/*_grpc.pb.go

      - name: Check generated proto package split
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          repo_root="$(git rev-parse --show-toplevel)"
          bash "$repo_root/.github/scripts/check-go-proto-split.sh" "$repo_root/gestaltd"

      - name: Verify checked-in routinggen output
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          repo_root="$(git rev-parse --show-toplevel)"
          cd "$repo_root/gestaltd/services/cache" && go generate ./...
          cd "$repo_root/gestaltd/services/indexeddb" && go generate ./...
          cd "$repo_root/gestaltd/services/s3" && go generate ./...
          cd "$repo_root"
          git diff --exit-code -- \
            gestaltd/services/cache/routing_cache_gen.go \
            gestaltd/services/indexeddb/routing_indexeddb_gen.go \
            gestaltd/services/s3/routing_s3_gen.go \
            gestaltd/services/s3/routing_s3_object_access_gen.go

      - name: Run golangci-lint
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11.3
          working-directory: gestaltd
          verify: false
          skip-cache: true

  test:
    name: Go Tests
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Skip irrelevant changes
        if: ${{ needs.resolve-ref.outputs.should_validate == 'false' }}
        run: echo "No Gestaltd-related changes detected; required check satisfied."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Set up Helm
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Run tests
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        working-directory: gestaltd
        run: go test ./...

  coverage:
    name: Go Coverage
    needs: resolve-ref
    if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Run coverage
        working-directory: gestaltd
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: gestaltd/coverage.out
          fail_ci_if_error: false

  race:
    name: Go Race Tests (${{ matrix.name }})
    needs: resolve-ref
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bootstrap
            packages: ./internal/bootstrap
            parallel: default
          - name: operator
            packages: ./internal/operator
            parallel: 16
          - name: daemon
            packages: ./internal/daemon
            parallel: 16
          - name: rest
            packages: rest
            parallel: 16
    defaults:
      run:
        working-directory: gestaltd

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Run race tests
        env:
          RACE_PACKAGES: ${{ matrix.packages }}
          RACE_PARALLEL: ${{ matrix.parallel }}
        run: |
          set -euo pipefail

          parallel_flag=()
          if [[ "${RACE_PARALLEL}" != "default" ]]; then
            parallel_flag=(-parallel="${RACE_PARALLEL}")
          fi

          if [[ "${RACE_PACKAGES}" == "rest" ]]; then
            packages="$(go list ./... | grep -Ev '/internal/(bootstrap|daemon|operator)$')"
            go test -race "${parallel_flag[@]}" -timeout=15m ${packages}
          else
            go test -race "${parallel_flag[@]}" -timeout=15m "${RACE_PACKAGES}"
          fi

  helm-validate:
    name: Helm Chart Validation
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip irrelevant changes
        if: ${{ needs.resolve-ref.outputs.should_validate == 'false' }}
        run: echo "No Gestaltd-related changes detected; required check satisfied."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Helm
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Helm lint
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: helm lint gestaltd/deploy/helm/gestaltd

      - name: Helm template (default chart profile)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            > /tmp/rendered-default.yaml

      - name: Helm template (ingress)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            --set ingress.enabled=true \
            --set-string ingress.hosts[0].host=gestalt.example.com \
            --set-string ingress.hosts[0].paths[0].path=/gestalt \
            --set-string ingress.hosts[0].paths[0].pathType=Prefix \
            > /tmp/rendered-ingress.yaml

      - name: Helm template
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            -f gestaltd/deploy/helm/gestaltd/ci-values.yaml \
            > /tmp/rendered.yaml

      - name: Install kubeconform
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          set -euo pipefail
          version="v0.7.0"
          archive="kubeconform-linux-amd64.tar.gz"
          checksum="c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
          tmp_dir="$(mktemp -d)"
          archive_path="${tmp_dir}/${archive}"

          trap 'rm -rf "${tmp_dir}"' EXIT

          curl -fsSLo "${archive_path}" \
            "https://github.com/yannh/kubeconform/releases/download/${version}/${archive}"
          actual_checksum="$(sha256sum "${archive_path}" | awk '{print $1}')"
          if [ "${actual_checksum}" != "${checksum}" ]; then
            echo "Checksum mismatch for ${archive}: ${actual_checksum}" >&2
            exit 1
          fi
          tar xzf "${archive_path}" -C /usr/local/bin kubeconform

      - name: Validate Kubernetes schemas
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: kubeconform -strict -summary /tmp/rendered.yaml

      - name: Validate Kubernetes schemas (default chart profile)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: kubeconform -strict -summary /tmp/rendered-default.yaml

      - name: Validate Kubernetes schemas (ingress)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: kubeconform -strict -summary /tmp/rendered-ingress.yaml

      - name: Helm template (preparation)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            -f gestaltd/deploy/helm/gestaltd/ci-values-preparation.yaml \
            > /tmp/rendered-preparation.yaml

      - name: Validate Kubernetes schemas (preparation)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: kubeconform -strict -summary /tmp/rendered-preparation.yaml

  docker-build:
    name: Docker Image Build
    needs: resolve-ref
    if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Build static image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --file gestaltd/Dockerfile \
            --target static \
            --build-arg GESTALT_VERSION=ci \
            --tag gestaltd:ci-static \
            .

      - name: Build Alpine image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --file gestaltd/Dockerfile \
            --target alpine \
            --build-arg GESTALT_VERSION=ci \
            --tag gestaltd:ci-alpine \
            .

  docs-build:
    name: Docs Build
    needs: resolve-ref
    if: ${{ needs.resolve-ref.outputs.publish == 'true' && vars.GESTALTD_CI_IMAGE_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/build-docs.yml
    with:
      gestalt_ref: ${{ needs.resolve-ref.outputs.sha }}
    permissions:
      contents: read

  publish-ci-image:
    name: Publish CI Image
    needs: [resolve-ref, lint, test, coverage, race, helm-validate, docker-build, docs-build]
    if: ${{ needs.resolve-ref.outputs.publish == 'true' && vars.GESTALTD_CI_IMAGE_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Validate image configuration
        env:
          GESTALTD_ARTIFACT_REGISTRY_HOST: ${{ vars.GESTALTD_ARTIFACT_REGISTRY_HOST }}
          GESTALTD_CI_IMAGE_REPOSITORY: ${{ vars.GESTALTD_CI_IMAGE_REPOSITORY }}
          GESTALTD_CI_GCP_SERVICE_ACCOUNT: ${{ vars.GESTALTD_CI_GCP_SERVICE_ACCOUNT }}
          GESTALTD_CI_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GESTALTD_CI_GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          : "${GESTALTD_ARTIFACT_REGISTRY_HOST:?GESTALTD_ARTIFACT_REGISTRY_HOST repository variable is required}"
          : "${GESTALTD_CI_IMAGE_REPOSITORY:?GESTALTD_CI_IMAGE_REPOSITORY repository variable is required}"
          : "${GESTALTD_CI_GCP_SERVICE_ACCOUNT:?GESTALTD_CI_GCP_SERVICE_ACCOUNT repository variable is required}"
          : "${GESTALTD_CI_GCP_WORKLOAD_IDENTITY_PROVIDER:?GESTALTD_CI_GCP_WORKLOAD_IDENTITY_PROVIDER repository variable is required}"

      - name: Compute image metadata
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GESTALTD_CI_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GESTALTD_CI_GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate to Artifact Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ vars.GESTALTD_ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Check for existing CI image
        id: existing-image
        env:
          GESTALTD_CI_IMAGE_REPOSITORY: ${{ vars.GESTALTD_CI_IMAGE_REPOSITORY }}
          GESTALTD_COMMIT: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          image="${GESTALTD_CI_IMAGE_REPOSITORY}:sha-${GESTALTD_COMMIT}"

          if digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            exists="true"
          else
            exists="false"
            digest=""
          fi

          {
            echo "image=${image}"
            echo "exists=${exists}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push CI image
        id: ci-image
        if: ${{ steps.existing-image.outputs.exists != 'true' }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: gestaltd/Dockerfile
          target: static
          push: true
          platforms: linux/amd64
          tags: ${{ vars.GESTALTD_CI_IMAGE_REPOSITORY }}:sha-${{ needs.resolve-ref.outputs.sha }}
          build-args: |
            GESTALT_VERSION=${{ needs.resolve-ref.outputs.version }}
            GESTALT_REVISION=${{ needs.resolve-ref.outputs.sha }}
            GESTALT_CREATED=${{ steps.meta.outputs.created }}
            GESTALT_SOURCE=https://github.com/${{ github.repository }}
            GESTALT_DOCUMENTATION=https://gestaltd.ai
            GESTALT_URL=${{ vars.GESTALTD_CI_IMAGE_REPOSITORY }}:sha-${{ needs.resolve-ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          sbom: true
          provenance: mode=max

      - name: Resolve published image
        id: published-image
        env:
          EXISTING_DIGEST: ${{ steps.existing-image.outputs.digest }}
          GESTALTD_CI_IMAGE_REPOSITORY: ${{ vars.GESTALTD_CI_IMAGE_REPOSITORY }}
          GESTALTD_COMMIT: ${{ needs.resolve-ref.outputs.sha }}
          PUSHED_DIGEST: ${{ steps.ci-image.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${PUSHED_DIGEST:-${EXISTING_DIGEST}}"
          : "${digest:?Expected a pushed or existing image digest}"
          image="${GESTALTD_CI_IMAGE_REPOSITORY}:sha-${GESTALTD_COMMIT}@${digest}"
          {
            echo "digest=${digest}"
            echo "image=${image}"
          } >> "${GITHUB_OUTPUT}"

      - name: Smoke test CI image
        env:
          GESTALTD_CI_IMAGE: ${{ steps.published-image.outputs.image }}
          GESTALTD_VERSION: ${{ needs.resolve-ref.outputs.version }}
        run: |
          set -euo pipefail
          actual_version="$(docker run --rm "${GESTALTD_CI_IMAGE}" version)"
          if [[ "${actual_version}" != "${GESTALTD_VERSION}" ]]; then
            echo "gestaltd version output '${actual_version}' did not match expected '${GESTALTD_VERSION}'." >&2
            exit 1
          fi

      - name: Summarize CI image
        env:
          GESTALTD_CI_IMAGE: ${{ steps.published-image.outputs.image }}
          GESTALTD_CI_IMAGE_EXISTS: ${{ steps.existing-image.outputs.exists }}
        run: |
          set -euo pipefail
          {
            echo "## gestaltd CI image"
            echo
            if [[ "${GESTALTD_CI_IMAGE_EXISTS}" == "true" ]]; then
              echo "Existing immutable image reused."
              echo
            fi
            echo '```text'
            echo "${GESTALTD_CI_IMAGE}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
