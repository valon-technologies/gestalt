name: Validate Gestaltd

# Reusable validation suite for gestaltd: resolves the build ref and runs the
# Go + Helm checks. Called by ci.yml (pull requests) and cd.yml (main / dispatch
# / schedule). The check selection is controlled by inputs so each caller can
# run the appropriate subset; github context (event name, PR diff) is inherited
# from the caller, so the ref-resolution logic is unchanged.

on:
  workflow_call:
    inputs:
      ref:
        description: Optional full commit SHA to validate (defaults to the triggering ref).
        required: false
        type: string
      run-race:
        description: Whether to run the race-detector test matrix.
        required: false
        default: true
        type: boolean
      run-coverage:
        description: Whether to run the coverage job (uploads to Codecov).
        required: false
        default: true
        type: boolean
    outputs:
      sha:
        value: ${{ jobs.resolve-ref.outputs.sha }}
      version:
        value: ${{ jobs.resolve-ref.outputs.version }}
      should-validate:
        value: ${{ jobs.resolve-ref.outputs.should_validate }}
      publish:
        value: ${{ jobs.resolve-ref.outputs.publish }}

permissions:
  contents: read

jobs:
  # Ref resolution lives in its own reusable workflow so the callers (ci.yml /
  # cd.yml) can resolve the build ref once and start the image build in parallel
  # with this suite. Its outputs stay accessible here as
  # needs.resolve-ref.outputs.*.
  resolve-ref:
    uses: ./.github/workflows/resolve-gestaltd-ref.yml
    with:
      ref: ${{ inputs.ref }}

  lint:
    name: Go Lint & Vet
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Skip irrelevant changes
        if: ${{ needs.resolve-ref.outputs.should_validate == 'false' }}
        working-directory: .
        run: echo "No Gestaltd-related changes detected; required check satisfied."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          fetch-depth: 0

      - name: Set up Go
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Install Buf
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        working-directory: gestaltd
        run: go install github.com/bufbuild/buf/cmd/buf@v1.66.1

      - name: Check go mod tidy
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        working-directory: gestaltd
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify checked-in generated bindings
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          repo_root="$(git rev-parse --show-toplevel)"
          cd "$repo_root/sdk/proto"
          "$(go env GOPATH)/bin/buf" generate --template buf.go.server.gen.yaml
          cd "$repo_root"
          git diff --exit-code -- gestaltd/rpc/protov1/v1/*.pb.go gestaltd/rpc/protov1/v1/*_grpc.pb.go

      - name: Check generated proto package split
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          repo_root="$(git rev-parse --show-toplevel)"
          bash "$repo_root/.github/scripts/check-go-proto-split.sh" "$repo_root/gestaltd"

      - name: Verify checked-in routinggen output
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          repo_root="$(git rev-parse --show-toplevel)"
          cd "$repo_root/gestaltd/services/cache" && go generate ./...
          cd "$repo_root/gestaltd/services/indexeddb" && go generate ./...
          cd "$repo_root/gestaltd/services/s3" && go generate ./...
          cd "$repo_root"
          git diff --exit-code -- \
            gestaltd/services/cache/routing_cache_gen.go \
            gestaltd/services/indexeddb/routing_indexeddb_gen.go \
            gestaltd/services/s3/routing_s3_gen.go \
            gestaltd/services/s3/routing_s3_object_access_gen.go

      - name: Collect lint packages
        id: collect-lint-packages
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || needs.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            import_packages=$("$GITHUB_WORKSPACE/.github/scripts/collect-go-test-packages.sh" "$GITHUB_WORKSPACE/gestaltd")
            if [[ -z "$import_packages" ]]; then
              packages=""
            elif [[ "$import_packages" == "./..." ]]; then
              packages="./..."
            else
              packages=""
              while IFS= read -r import_package; do
                package_dir=$(cd "$GITHUB_WORKSPACE/gestaltd" && go list -f '{{.Dir}}' "$import_package")
                if [[ "$package_dir" == "$GITHUB_WORKSPACE/gestaltd" ]]; then
                  relative_package_dir="."
                else
                  relative_package_dir=${package_dir#"$GITHUB_WORKSPACE/gestaltd"/}
                fi
                packages="${packages} ./${relative_package_dir}"
              done <<< "$import_packages"
              packages=$(echo "$packages" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            fi
          else
            packages="./..."
          fi

          echo "$packages"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' && steps.collect-lint-packages.outputs.packages != '' }}
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11.3
          working-directory: gestaltd
          verify: false
          skip-cache: true
          args: ${{ steps.collect-lint-packages.outputs.packages }}

  test:
    name: Go Tests
    needs: resolve-ref
    if: ${{ !inputs.run-coverage }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Skip irrelevant changes
        if: ${{ needs.resolve-ref.outputs.should_validate == 'false' }}
        working-directory: .
        run: echo "No Gestaltd-related changes detected; required check satisfied."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          fetch-depth: 0

      - name: Set up Go
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Set up Helm
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Run tests
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        working-directory: gestaltd
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || needs.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            packages=$("$GITHUB_WORKSPACE/.github/scripts/collect-go-test-packages.sh" "$GITHUB_WORKSPACE/gestaltd")
            # Compile-check every package (including test files) without running
            # any tests, so packages whose tests aren't in the affected set still
            # fail the build if they stop compiling. `go vet ./...` type-checks
            # and compiles all packages but, unlike `go test -run '^$' ./...`,
            # never executes TestMain — avoiding its expensive fixture builds.
            go vet ./...
            if [[ -z "$packages" ]]; then
              echo "No Go packages affected by this pull request."
              exit 0
            fi
          else
            packages="./..."
          fi

          echo "$packages"
          go test $packages

  build-fixtures:
    name: Build Test Fixtures
    needs: resolve-ref
    # Build the gestaltd binary once and share it with the coverage and race
    # jobs, which otherwise each rebuild it in TestMain. Runs whenever any
    # consuming job runs (the same gate as coverage OR race below).
    if: ${{ (inputs.run-coverage || inputs.run-race) && needs.resolve-ref.outputs.should_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Build gestaltd fixture
        working-directory: gestaltd
        run: |
          mkdir -p "${RUNNER_TEMP}/test-fixtures"
          go build -o "${RUNNER_TEMP}/test-fixtures/gestaltd" ./cmd/gestaltd

      - name: Upload test fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gestaltd-test-fixtures
          path: ${{ runner.temp }}/test-fixtures
          retention-days: 1
          if-no-files-found: error

  coverage:
    name: Go Tests with Coverage
    needs: [resolve-ref, build-fixtures]
    if: ${{ inputs.run-coverage && needs.resolve-ref.outputs.should_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Download test fixtures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gestaltd-test-fixtures
          path: ${{ runner.temp }}/test-fixtures

      - name: Restore fixture permissions
        run: chmod +x "${RUNNER_TEMP}/test-fixtures/"*

      - name: Run coverage
        working-directory: gestaltd
        env:
          GESTALT_TEST_FIXTURE_DIR: ${{ runner.temp }}/test-fixtures
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: gestaltd/coverage.out
          fail_ci_if_error: false

  race:
    name: Go Race Tests (${{ matrix.name }})
    needs: [resolve-ref, build-fixtures]
    if: ${{ inputs.run-race && needs.resolve-ref.outputs.should_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bootstrap
            packages: ./internal/bootstrap
            parallel: default
          - name: operator
            packages: ./internal/operator
            parallel: 16
          - name: daemon
            packages: ./internal/daemon
            parallel: 16
          - name: rest
            packages: rest
            parallel: 16
    defaults:
      run:
        working-directory: gestaltd

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: gestaltd/go.mod
          cache-dependency-path: gestaltd/go.sum

      - name: Download test fixtures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gestaltd-test-fixtures
          path: ${{ runner.temp }}/test-fixtures

      - name: Restore fixture permissions
        run: chmod +x "${RUNNER_TEMP}/test-fixtures/"*

      - name: Run race tests
        env:
          GESTALT_TEST_FIXTURE_DIR: ${{ runner.temp }}/test-fixtures
          RACE_PACKAGES: ${{ matrix.packages }}
          RACE_PARALLEL: ${{ matrix.parallel }}
        run: |
          set -euo pipefail

          parallel_flag=()
          if [[ "${RACE_PARALLEL}" != "default" ]]; then
            parallel_flag=(-parallel="${RACE_PARALLEL}")
          fi

          if [[ "${RACE_PACKAGES}" == "rest" ]]; then
            packages="$(go list ./... | grep -Ev '/internal/(bootstrap|daemon|operator)$')"
            go test -race "${parallel_flag[@]}" -timeout=15m ${packages}
          else
            go test -race "${parallel_flag[@]}" -timeout=15m "${RACE_PACKAGES}"
          fi

  helm-validate:
    name: Helm Chart Validation
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip irrelevant changes
        if: ${{ needs.resolve-ref.outputs.should_validate == 'false' }}
        run: echo "No Gestaltd-related changes detected; required check satisfied."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Helm
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Helm lint
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: helm lint gestaltd/deploy/helm/gestaltd

      - name: Helm template (default chart profile)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            > /tmp/rendered-default.yaml

      - name: Helm template (ingress)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            --set ingress.enabled=true \
            --set-string ingress.hosts[0].host=gestalt.example.com \
            --set-string ingress.hosts[0].paths[0].path=/gestalt \
            --set-string ingress.hosts[0].paths[0].pathType=Prefix \
            > /tmp/rendered-ingress.yaml

      - name: Helm template
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            -f gestaltd/deploy/helm/gestaltd/ci-values.yaml \
            > /tmp/rendered.yaml

      - name: Install kubeconform
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          set -euo pipefail
          version="v0.7.0"
          archive="kubeconform-linux-amd64.tar.gz"
          checksum="c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
          tmp_dir="$(mktemp -d)"
          archive_path="${tmp_dir}/${archive}"

          trap 'rm -rf "${tmp_dir}"' EXIT

          curl -fsSLo "${archive_path}" \
            "https://github.com/yannh/kubeconform/releases/download/${version}/${archive}"
          actual_checksum="$(sha256sum "${archive_path}" | awk '{print $1}')"
          if [ "${actual_checksum}" != "${checksum}" ]; then
            echo "Checksum mismatch for ${archive}: ${actual_checksum}" >&2
            exit 1
          fi
          tar xzf "${archive_path}" -C /usr/local/bin kubeconform

      - name: Validate Kubernetes schemas
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: kubeconform -strict -summary /tmp/rendered.yaml

      - name: Validate Kubernetes schemas (default chart profile)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: kubeconform -strict -summary /tmp/rendered-default.yaml

      - name: Validate Kubernetes schemas (ingress)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: kubeconform -strict -summary /tmp/rendered-ingress.yaml

      - name: Helm template (preparation)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: |
          helm template test-release gestaltd/deploy/helm/gestaltd \
            -f gestaltd/deploy/helm/gestaltd/ci-values-preparation.yaml \
            > /tmp/rendered-preparation.yaml

      - name: Validate Kubernetes schemas (preparation)
        if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
        run: kubeconform -strict -summary /tmp/rendered-preparation.yaml
