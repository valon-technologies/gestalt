name: CI (gestaltd)

# Pull-request checks for gestaltd. Runs the shared validation suite and builds
# the CI image without pushing (build-only, plus alpine packaging validation).
# Also runs hourly as a health check against the default branch. Publishing
# happens in cd.yml on main / dispatch.

on:
  pull_request:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  resolve-ref:
    uses: ./.github/workflows/resolve-gestaltd-ref.yml

  validate:
    uses: ./.github/workflows/validate-gestaltd.yml
    with:
      # PRs run unit tests with coverage; race and e2e run on the hourly schedule.
      run-race: ${{ github.event_name == 'schedule' }}
      run-e2e: ${{ github.event_name == 'schedule' }}

  # Build-only Dockerfile/packaging validation. Depends on resolve-ref rather
  # than validate so it runs in parallel with the Go + Helm checks instead of
  # waiting for them.
  build:
    name: Build CI Image
    needs: resolve-ref
    if: ${{ needs.resolve-ref.outputs.should_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - uses: ./.github/actions/build-gestaltd-image
        with:
          push: 'false'
          build-alpine: 'true'
          sha: ${{ needs.resolve-ref.outputs.sha }}
          version: ${{ needs.resolve-ref.outputs.version }}
