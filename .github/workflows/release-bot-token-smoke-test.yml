name: Release Bot Token Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-bot-token-smoke-test.yml
      - .github/workflows/release-gestalt-cli.yml
      - .github/workflows/release-gestaltd.yml

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke Test Release Bot Token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate release bot token
        id: release-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GESTALT_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GESTALT_RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            gestalt
            homebrew-gestalt
          permission-contents: write

      - name: Checkout Gestalt
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.release-bot-token.outputs.token }}

      - name: Checkout Homebrew tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: valon-technologies/homebrew-gestalt
          ref: main
          token: ${{ steps.release-bot-token.outputs.token }}
          path: homebrew-tap

      - name: Verify repository API access
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
        run: |
          gh api repos/${{ github.repository }} --jq '.full_name'
          gh api repos/${{ github.repository_owner }}/homebrew-gestalt --jq '.full_name'

      - name: Verify Homebrew tap push access
        run: |
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap commit --allow-empty -m "Release bot token smoke test"
          git -C homebrew-tap push --dry-run origin HEAD:refs/heads/release-bot-token-smoke-test
