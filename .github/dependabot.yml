version: 2
updates:
  - package-ecosystem: docker
    directory: /gestaltd
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

