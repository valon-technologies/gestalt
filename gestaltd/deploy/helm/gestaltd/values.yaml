# Base chart values for Kubernetes deployments.
#
# This file intentionally omits dev-only scalar defaults for config fields that
# production overrides usually supply as structured maps (for example
# server.encryptionKey and indexeddb.main source/dsn). That avoids Helm
# coalesce warnings when layering full production values on top of the chart.
#
# For local development with SQLite and a static encryption key, also pass
# values-local.yaml. Configure OAuth/OIDC, server.encryptionKey, and a
# networked datastore before using this chart in shared or production
# environments.
replicaCount: 1

image:
  repository: valontechnologies/gestaltd
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Gestalt does not need Kubernetes API access.
  automount: false
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8080
  # Annotations applied to the public Service. For container-native load
  # balancing behind a Google Cloud load balancer, set:
  #   cloud.google.com/neg: '{"ingress": true}'
  # GKE then maintains standalone zonal NEGs named after the Service that a
  # backend service can reference.
  annotations: {}

managementService:
  enabled: false
  type: ClusterIP
  port: 9090
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gestalt.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: gestalt-tls
  #    hosts:
  #      - gestalt.local

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

persistence:
  enabled: true
  # When persistence is disabled, an emptyDir still mounts /data so a
  # chart-rendered config keeps working. Set emptyDir to false to run without
  # any /data volume and use artifacts baked into the image (parity mode:
  # the image already contains a prepared artifacts dir at /data and the
  # serve arguments below reference it).
  emptyDir: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

# Container-level readOnlyRootFilesystem. The chart default keeps the root
# filesystem read-only because all state lives in /data or /tmp. Parity
# deployments whose image bakes a prepared artifacts dir into /data still
# write runtime state (for example registry-installed apps) under /data, so
# they must set this to false. The container always runs as non-root (65534).
readOnlyRootFilesystem: true

# Fully replace the rendered container arguments. Leave empty to use the
# chart-rendered serve arguments. Parity deployments whose image bakes its
# own layered --config/--lockfile/--artifacts-dir command set this to the
# image's CMD, for example:
#   argsOverride:
#     - serve
#     - --locked
#     - --no-sync
#     - --lockfile
#     - /app/deploy/gestalt.lock.json
#     - --config
#     - /app/deploy/config.yaml
#     - --artifacts-dir
#     - /data
# The image entrypoint (ENTRYPOINT) is always taken from the image; the
# chart never overrides the container command.
argsOverride: []

# Optional startup probe. Kubernetes runs it to exclusion of liveness and
# readiness probes until the container first reports success, which keeps a
# slow cold start (large registry materialization) from being killed by the
# liveness probe. Mirror of the Cloud Run startup probe used by the
# production deploys:
#   startupProbe:
#     httpGet:
#       path: /ready
#       port: http
#     periodSeconds: 5
#     timeoutSeconds: 3
#     failureThreshold: 240
startupProbe: {}

# Optional PodDisruptionBudget protecting the Deployment during node
# upgrades and drains. Requires at least one of minAvailable or
# maxUnavailable when enabled.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

# Optional pod-level annotations and labels, merged into the pod template
# alongside the chart's config checksum annotation and standard labels.
podAnnotations: {}
podLabels: {}

# Optional termination grace period in seconds. Parity deployments should
# set this generously (for example 600) so in-flight agent sessions and
# workflow activities drain before the pod is stopped.
terminationGracePeriodSeconds: null

updateStrategy:
  type: Recreate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Mounted as /etc/gestaltd/config.yaml. The app expands ${ENV_VAR}
# placeholders at startup, so secrets can be injected via extraEnv when
# you enable OAuth/OIDC or an external datastore below.
config:
  apiVersion: gestaltd.config/v8
  server:
    public:
      port: 8080
    # Configure a separate internal-only management listener for the admin UI and
    # /metrics. Keep the management service disabled unless you also expose a
    # matching internal Kubernetes Service below.
    # management:
    #   host: 0.0.0.0
    #   port: 9090
    # Set encryptionKey here or via values-local.yaml / production overrides.
    # baseUrl is optional for the default local/dev profile.
    # Set it to your public HTTPS URL when auth callbacks or external
    # integrations need it.
    # baseUrl: "${GESTALT_BASE_URL}"
    providers:
      indexeddb: main
  # Configure indexeddb.main in values-local.yaml or production overrides.
  providers: {}

# Extra environment variables for the container. These are only required
# when your config uses ${VAR} placeholders for auth, baseUrl, or
# external datastore settings.
extraEnv: []
# - name: GESTALT_BASE_URL
#   value: "https://gestalt.example.com"
# - name: GESTALT_ENCRYPTION_KEY
#   valueFrom:
#     secretKeyRef:
#       name: gestaltd-secrets
#       key: encryption-key
# --- Google provider ---
# - name: GOOGLE_CLIENT_ID
#   valueFrom:
#     secretKeyRef:
#       name: gestaltd-secrets
#       key: google-client-id
# - name: GOOGLE_CLIENT_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: gestaltd-secrets
#       key: google-client-secret
# --- OIDC provider ---
# - name: OIDC_ISSUER_URL
#   value: "https://login.example.com"
# - name: OIDC_CLIENT_ID
#   valueFrom:
#     secretKeyRef:
#       name: gestaltd-secrets
#       key: oidc-client-id
# - name: OIDC_CLIENT_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: gestaltd-secrets
#       key: oidc-client-secret
# - name: OIDC_SESSION_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: gestaltd-secrets
#       key: oidc-session-secret

preparation:
  # Enable this when your config uses remote REST/GraphQL upstreams or
  # packaged apps and you want the chart to lock and sync prepared artifacts
  # before the main container starts in locked mode.
  enabled: false

lockedServe:
  # Enable this when lock state and prepared artifacts are baked into the image
  # or mounted by external automation, without using the chart's preparation
  # container.
  enabled: false

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}

tolerations: []

affinity: {}
