<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestalt Admin</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fb;
        --fg: #1d2430;
        --muted: #657386;
        --border: #d9e0ea;
        --surface: #ffffff;
        --accent: #2764c7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11161f;
          --fg: #eef2f8;
          --muted: #a8b3c3;
          --border: #273244;
          --surface: #171e2a;
          --accent: #82aaff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(1100px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 650;
      }
      p {
        margin: 8px 0 0;
        color: var(--muted);
      }
      .panel {
        margin-top: 24px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .status {
        color: var(--muted);
      }
      button {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        font: inherit;
        padding: 6px 10px;
      }
      button:hover {
        border-color: var(--accent);
      }
      pre {
        margin: 0;
        min-height: 480px;
        max-height: calc(100vh - 220px);
        overflow: auto;
        padding: 16px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gestalt Admin</h1>
      <p>Inspect the live Prometheus telemetry exposed by this process.</p>

      <section class="panel">
        <div class="toolbar">
          <span id="status" class="status">Loading metrics...</span>
          <button id="refresh-button" type="button">Refresh</button>
        </div>
        <pre id="metrics-output"></pre>
      </section>
    </main>
    <script>
      (function () {
        const status = document.getElementById("status");
        const output = document.getElementById("metrics-output");
        const refreshButton = document.getElementById("refresh-button");

        async function loadMetrics() {
          status.textContent = "Loading metrics...";
          try {
            const response = await fetch("/metrics", {
              headers: { Accept: "text/plain" },
              cache: "no-store",
            });
            if (!response.ok) {
              throw new Error("Metrics request failed with HTTP " + response.status);
            }
            output.textContent = await response.text();
            status.textContent = "Last refreshed " + new Date().toLocaleTimeString();
          } catch (error) {
            output.textContent = "";
            status.textContent = error instanceof Error ? error.message : "Failed to load metrics.";
          }
        }

        refreshButton.addEventListener("click", loadMetrics);
        loadMetrics();
      })();
    </script>
  </body>
</html>
