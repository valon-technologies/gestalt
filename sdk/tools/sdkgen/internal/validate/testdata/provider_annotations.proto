// Test mirror of sdk/proto/v1/annotations.proto: only the extension full
// names and shapes matter to the parser.
syntax = "proto3";

package gestalt.provider.v1;

import "google/protobuf/descriptor.proto";

message OptionalResult {
  string guard = 1;
  string value = 2;
}

message Keyed {
  string entries = 1;
  string key = 2;
  string present = 3;
  string value = 4;
}

message Initial {
  string header = 1;
  string chunk = 2;
}

message JsonResult {
  string status = 1;
  string body = 2;
}

enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_APP = 1;
  PROVIDER_KIND_IDENTITY = 2;
  PROVIDER_KIND_INDEXEDDB = 3;
  PROVIDER_KIND_SECRETS = 4;
  PROVIDER_KIND_TELEMETRY = 5;
  PROVIDER_KIND_CACHE = 6;
  PROVIDER_KIND_S3 = 7;
  PROVIDER_KIND_WORKFLOW = 8;
  PROVIDER_KIND_AUTHORIZATION = 9;
  PROVIDER_KIND_RUNTIME = 10;
  PROVIDER_KIND_AGENT = 11;
  PROVIDER_KIND_EXTERNAL_CREDENTIAL = 12;
  PROVIDER_KIND_TEST = 13;
}

enum ProviderInput {
  PROVIDER_INPUT_FULL_REQUEST = 0;
  PROVIDER_INPUT_CLIENT_SIGNATURE = 1;
}

extend google.protobuf.MethodOptions {
  repeated string signature = 50001;
  Initial initial = 50002;
  JsonResult json_result = 50003;
  repeated string optional_signature = 50004;
  ProviderInput provider_input = 50005;
}

extend google.protobuf.MessageOptions {
  OptionalResult optional_result = 50001;
  Keyed keyed = 50002;
  string unwrap = 50003;
}

extend google.protobuf.ServiceOptions {
  string host_binding = 50001;
  ProviderKind provider_kind = 50002;
}
