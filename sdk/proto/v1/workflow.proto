syntax = "proto3";

package gestalt.provider.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "v1/agent.proto";
import "v1/plugin.proto";

message BoundWorkflowTarget {
  reserved 1 to 7;
  reserved "plugin_name", "operation", "input", "connection", "instance", "plugin", "agent";

  repeated WorkflowStep steps = 8;
}

message WorkflowStep {
  string id = 1;
  map<string, WorkflowValue> inputs = 2;
  WorkflowStepWhen when = 3;
  int32 timeout_seconds = 4;
  WorkflowStepDelivery output_delivery = 5;
  google.protobuf.Struct metadata = 6;

  oneof action {
    WorkflowStepPluginCall plugin = 10;
    WorkflowStepAgentTurn agent = 11;
  }
}

message WorkflowStepPluginCall {
  string name = 1;
  string operation = 2;
  WorkflowValue input = 3;
  string connection = 4;
  string instance = 5;
  string credential_mode = 6;
}

message WorkflowStepDelivery {
  WorkflowStepPluginCall plugin = 1;
}

message WorkflowStepAgentTurn {
  string provider = 1;
  string model = 2;
  WorkflowText session_key = 3;
  WorkflowText prompt = 4;
  repeated WorkflowAgentMessage messages = 5;
  repeated AgentToolRef tools = 6;
  google.protobuf.Struct response_schema = 7;
  google.protobuf.Struct model_options = 8;
}

message WorkflowAgentMessage {
  string role = 1;
  WorkflowText text = 2;
  google.protobuf.Struct metadata = 3;
}

message WorkflowText {
  string template = 1;
}

message WorkflowStepWhen {
  WorkflowValue value = 1;
  google.protobuf.Value equals = 2;
}

message WorkflowValue {
  reserved 7, 8, 10, 11;
  reserved "signal_metadata", "workflow_context", "event", "schedule";
  oneof kind {
    google.protobuf.Value literal = 1;
    WorkflowObject object = 2;
    WorkflowArray array = 3;
    WorkflowText template = 4;
    WorkflowPathSource run_input = 5;
    WorkflowPathSource signal_payload = 6;
    WorkflowStepOutputSource step_output = 9;
  }
}

message WorkflowObject {
  map<string, WorkflowValue> fields = 1;
}

message WorkflowArray {
  repeated WorkflowValue values = 1;
}

message WorkflowPathSource {
  string path = 1;
}

message WorkflowStepOutputSource {
  string step_id = 1;
  string path = 2;
}

message WorkflowActor {
  string subject_id = 1;
  string subject_kind = 2;
  string display_name = 3;
  string auth_source = 4;
}

message WorkflowRunAsSubject {
  string subject_id = 1;
  string subject_kind = 2;
  string display_name = 3;
  string auth_source = 4;
  string credential_subject_id = 5;
}

message WorkflowEvent {
  string id = 1;
  string source = 2;
  string spec_version = 3;
  string type = 4;
  string subject = 5;
  google.protobuf.Timestamp time = 6;
  string datacontenttype = 7;
  google.protobuf.Struct data = 8;
  map<string, google.protobuf.Value> extensions = 9;
}

message WorkflowEventMatch {
  string type = 1;
  string source = 2;
  string subject = 3;
}

enum WorkflowActivationMode {
  WORKFLOW_ACTIVATION_MODE_UNSPECIFIED = 0;
  WORKFLOW_ACTIVATION_MODE_START = 1;
  WORKFLOW_ACTIVATION_MODE_SIGNAL = 2;
  WORKFLOW_ACTIVATION_MODE_SIGNAL_OR_START = 3;
}

message WorkflowManualActivation {}

message WorkflowScheduleActivation {
  string cron = 1;
  string timezone = 2;
}

message WorkflowEventActivation {
  WorkflowEventMatch match = 1;
}

message WorkflowActivation {
  string id = 1;
  bool paused = 2;
  WorkflowActivationMode mode = 3;
  WorkflowValue input = 4;
  WorkflowValue run_key = 5;
  WorkflowValue idempotency_key = 6;

  oneof kind {
    WorkflowManualActivation manual = 10;
    WorkflowScheduleActivation schedule = 11;
    WorkflowEventActivation event = 12;
  }
}

message WorkflowAccessPermission {
  string plugin = 1;
  repeated string operations = 2;
  repeated string actions = 3;
}

message WorkflowExecutionReference {
  string id = 1;
  string provider_name = 2;
  BoundWorkflowTarget target = 3;
  string caller_plugin_name = 4;
  string source_definition_id = 5;

  string subject_id = 10;
  string subject_kind = 11;
  string display_name = 12;
  string auth_source = 13;
  string credential_subject_id = 14;
  WorkflowRunAsSubject run_as = 15;

  repeated WorkflowAccessPermission permissions = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp revoked_at = 22;

  string target_digest = 30;
  string provider_plan_digest = 31;
  string permissions_digest = 32;
  string semantics_version = 33;
  int64 generation = 34;
  string seal = 35;
}

message PutWorkflowExecutionReferenceRequest {
  WorkflowExecutionReference execution_ref = 1;
}

message GetWorkflowExecutionReferenceRequest {
  string id = 1;
}

message ListWorkflowExecutionReferencesRequest {
  string subject_id = 1;
}

message ListWorkflowExecutionReferencesResponse {
  repeated WorkflowExecutionReference execution_refs = 1;
}

message WorkflowDeploymentSpec {
  string id = 1;
  int64 generation = 2;
  BoundWorkflowTarget target = 3;
  repeated WorkflowActivation activations = 4;
  bool paused = 5;
  WorkflowRunAsSubject run_as = 6;
  repeated WorkflowAccessPermission permissions = 7;
  map<string, string> labels = 8;
  string workflow_semantics_version = 9;
}

enum WorkflowActionKind {
  WORKFLOW_ACTION_KIND_UNSPECIFIED = 0;
  WORKFLOW_ACTION_KIND_PLUGIN = 1;
  WORKFLOW_ACTION_KIND_AGENT_TURN = 2;
  WORKFLOW_ACTION_KIND_DELIVERY = 3;
}

message WorkflowActionDescriptor {
  string action_id = 1;
  string step_id = 2;
  WorkflowActionKind kind = 3;
  WorkflowStepPluginCall plugin = 4;
  WorkflowStepAgentTurn agent = 5;
}

message WorkflowActionTable {
  repeated WorkflowActionDescriptor actions = 1;
  string digest = 2;
}

message WorkflowUnsupportedFeature {
  string feature = 1;
  string reason = 2;
}

message PlanWorkflowRequest {
  WorkflowDeploymentSpec spec = 1;
  string spec_digest = 2;
  string target_digest = 3;
  string action_table_digest = 4;
  string target_canonicalization_version = 5;
  string workflow_semantics_version = 6;
}

message PlanWorkflowResponse {
  string accepted_spec_digest = 1;
  string provider_plan_id = 2;
  string provider_plan_digest = 3;
  string provider_plan_format_version = 4;
  repeated WorkflowUnsupportedFeature unsupported = 5;
  repeated string supported_feature_flags = 6;
}

message WorkflowDeploymentBinding {
  string id = 1;
  string execution_ref = 2;
  int64 execution_ref_generation = 3;
  string execution_ref_seal = 4;
  string deployment_id = 5;
  int64 deployment_generation = 6;
  string spec_digest = 7;
  string target_digest = 8;
  string action_table_digest = 9;
  string provider_plan_id = 10;
  string provider_plan_digest = 11;
  string workflow_semantics_version = 12;
  string request_id = 13;
}

enum WorkflowDeploymentStatus {
  WORKFLOW_DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  WORKFLOW_DEPLOYMENT_STATUS_PENDING = 1;
  WORKFLOW_DEPLOYMENT_STATUS_ACTIVE = 2;
  WORKFLOW_DEPLOYMENT_STATUS_PAUSED = 3;
  WORKFLOW_DEPLOYMENT_STATUS_DELETED = 4;
  WORKFLOW_DEPLOYMENT_STATUS_FAILED = 5;
}

message WorkflowDeployment {
  WorkflowDeploymentSpec spec = 1;
  WorkflowDeploymentStatus status = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  int64 applied_generation = 5;
  string spec_digest = 6;
  string target_digest = 7;
  string action_table_digest = 8;
  string provider_plan_id = 9;
  string provider_plan_digest = 10;
  WorkflowDeploymentBinding binding = 11;
  WorkflowRunError error = 12;
}

message ApplyWorkflowDeploymentRequest {
  WorkflowDeploymentSpec spec = 1;
  PlanWorkflowResponse plan = 2;
  WorkflowDeploymentBinding binding = 3;
  string request_id = 4;
  bool validate_only = 5;
}

message GetWorkflowDeploymentRequest {
  string deployment_id = 1;
}

message ListWorkflowDeploymentsRequest {
  int32 page_size = 1;
  string page_token = 2;
  map<string, string> labels = 3;
}

message ListWorkflowDeploymentsResponse {
  repeated WorkflowDeployment deployments = 1;
  string next_page_token = 2;
}

message DeleteWorkflowDeploymentRequest {
  string deployment_id = 1;
  int64 generation = 2;
  string request_id = 3;
}

message SetWorkflowDeploymentPausedRequest {
  string deployment_id = 1;
  bool paused = 2;
  string request_id = 3;
}

message SetWorkflowActivationPausedRequest {
  string deployment_id = 1;
  string activation_id = 2;
  bool paused = 3;
  string request_id = 4;
}

enum WorkflowRunStatus {
  WORKFLOW_RUN_STATUS_UNSPECIFIED = 0;
  WORKFLOW_RUN_STATUS_PENDING = 1;
  WORKFLOW_RUN_STATUS_RUNNING = 2;
  WORKFLOW_RUN_STATUS_SUCCEEDED = 3;
  WORKFLOW_RUN_STATUS_FAILED = 4;
  WORKFLOW_RUN_STATUS_CANCELED = 5;
}

enum WorkflowStepStatus {
  WORKFLOW_STEP_STATUS_UNSPECIFIED = 0;
  WORKFLOW_STEP_STATUS_PENDING = 1;
  WORKFLOW_STEP_STATUS_RUNNING = 2;
  WORKFLOW_STEP_STATUS_SUCCEEDED = 3;
  WORKFLOW_STEP_STATUS_FAILED = 4;
  WORKFLOW_STEP_STATUS_SKIPPED = 5;
  WORKFLOW_STEP_STATUS_CANCELED = 6;
}

message WorkflowManualTrigger {}

message WorkflowScheduleTrigger {
  string activation_id = 1;
  google.protobuf.Timestamp scheduled_for = 2;
}

message WorkflowEventTrigger {
  string activation_id = 1;
  WorkflowEvent event = 2;
}

message WorkflowRunTrigger {
  string deployment_id = 1;
  int64 deployment_generation = 2;
  string activation_id = 3;

  oneof kind {
    WorkflowManualTrigger manual = 10;
    WorkflowScheduleTrigger schedule = 11;
    WorkflowEventTrigger event = 12;
  }
}

message WorkflowSignal {
  string id = 1;
  string name = 2;
  google.protobuf.Struct payload = 3;
  google.protobuf.Struct metadata = 4;
  WorkflowActor created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  string idempotency_key = 7;
  int64 sequence = 8;
}

message WorkflowOutputSummary {
  string envelope_version = 1;
  string kind = 2;
  int64 size_bytes = 3;
  string sha256 = 4;
  bool truncated = 5;
  bool redacted = 6;
  string media_type = 7;
}

message WorkflowRunError {
  string code = 1;
  string message = 2;
  string step_id = 3;
  string action_id = 4;
}

message WorkflowStepState {
  string step_id = 1;
  int32 step_index = 2;
  WorkflowStepStatus status = 3;
  string skipped_reason = 4;
  int32 attempt_number = 5;
  WorkflowOutputSummary output_summary = 6;
  string output_ref = 7;
  WorkflowRunError error = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message WorkflowRun {
  string id = 1;
  string deployment_id = 2;
  int64 deployment_generation = 3;
  string workflow_key = 4;
  WorkflowRunStatus status = 5;
  WorkflowRunTrigger trigger = 6;
  google.protobuf.Struct input = 7;
  WorkflowActor created_by = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
  string status_message = 12;
  string execution_ref = 13;
  int64 execution_ref_generation = 14;
  string target_digest = 15;
  string spec_digest = 16;
  string action_table_digest = 17;
  string provider_plan_digest = 18;
  repeated WorkflowStepState steps = 19;
  WorkflowRunError error = 20;
}

message StartWorkflowRunRequest {
  string deployment_id = 1;
  int64 deployment_generation = 2;
  string activation_id = 3;
  string workflow_key = 4;
  google.protobuf.Struct input = 5;
  string idempotency_key = 6;
  WorkflowActor created_by = 7;
}

message SignalWorkflowRunRequest {
  string run_id = 1;
  WorkflowSignal signal = 2;
}

message SignalOrStartWorkflowRunRequest {
  string deployment_id = 1;
  int64 deployment_generation = 2;
  string activation_id = 3;
  string workflow_key = 4;
  google.protobuf.Struct input = 5;
  string idempotency_key = 6;
  WorkflowSignal signal = 7;
  WorkflowActor created_by = 8;
}

message CancelWorkflowRunRequest {
  string run_id = 1;
  string reason = 2;
}

message GetWorkflowRunRequest {
  string run_id = 1;
}

message ListWorkflowRunsRequest {
  string deployment_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  WorkflowRunStatus status = 4;
}

message ListWorkflowRunsResponse {
  repeated WorkflowRun runs = 1;
  string next_page_token = 2;
}

message WorkflowRunSignal {
  WorkflowRun run = 1;
  WorkflowSignal signal = 2;
  bool started_run = 3;
  string workflow_key = 4;
}

message DeliverWorkflowEventRequest {
  string delivery_id = 1;
  WorkflowEvent event = 2;
  WorkflowActor published_by = 3;
  string idempotency_key = 4;
}

message WorkflowEventDeliveryResult {
  string deployment_id = 1;
  string activation_id = 2;
  WorkflowRun run = 3;
  WorkflowSignal signal = 4;
  bool started_run = 5;
}

message DeliverWorkflowEventResponse {
  repeated WorkflowEventDeliveryResult results = 1;
}

enum WorkflowRunEventType {
  WORKFLOW_RUN_EVENT_TYPE_UNSPECIFIED = 0;
  WORKFLOW_RUN_EVENT_TYPE_RUN_STARTED = 1;
  WORKFLOW_RUN_EVENT_TYPE_RUN_COMPLETED = 2;
  WORKFLOW_RUN_EVENT_TYPE_RUN_FAILED = 3;
  WORKFLOW_RUN_EVENT_TYPE_RUN_CANCELED = 4;
  WORKFLOW_RUN_EVENT_TYPE_SIGNAL_RECEIVED = 5;
  WORKFLOW_RUN_EVENT_TYPE_STEP_STARTED = 6;
  WORKFLOW_RUN_EVENT_TYPE_STEP_SUCCEEDED = 7;
  WORKFLOW_RUN_EVENT_TYPE_STEP_FAILED = 8;
  WORKFLOW_RUN_EVENT_TYPE_STEP_SKIPPED = 9;
  WORKFLOW_RUN_EVENT_TYPE_ACTION_INVOKED = 10;
  WORKFLOW_RUN_EVENT_TYPE_ACTION_COMPLETED = 11;
  WORKFLOW_RUN_EVENT_TYPE_ACTION_FAILED = 12;
}

message WorkflowRunEvent {
  string id = 1;
  string run_id = 2;
  int64 sequence = 3;
  WorkflowRunEventType type = 4;
  string step_id = 5;
  string action_id = 6;
  int32 attempt_number = 7;
  string message = 8;
  WorkflowOutputSummary output_summary = 9;
  string output_ref = 10;
  WorkflowRunError error = 11;
  google.protobuf.Timestamp observed_at = 12;
}

message GetWorkflowRunEventsRequest {
  string run_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListWorkflowRunEventsResponse {
  repeated WorkflowRunEvent events = 1;
  string next_page_token = 2;
}

message GetWorkflowRunOutputRequest {
  string run_id = 1;
  string output_ref = 2;
  string step_id = 3;
}

message WorkflowRunOutput {
  string output_ref = 1;
  WorkflowOutputSummary summary = 2;
  google.protobuf.Value body = 3;
}

message WorkflowHostActionSelector {
  string execution_ref = 1;
  int64 execution_ref_generation = 2;
  string execution_ref_seal = 3;
  string run_id = 4;
  string step_id = 7;
  string action_id = 8;
  int32 attempt_number = 9;
  string idempotency_key = 10;
  string target_digest = 11;
  string action_table_digest = 12;
  string provider_plan_digest = 13;
}

message WorkflowPluginActionPayload {
  google.protobuf.Struct input = 1;
}

message WorkflowAgentTurnPayload {
  WorkflowText prompt = 1;
  repeated WorkflowAgentMessage messages = 2;
}

message InvokeWorkflowActionRequest {
  WorkflowHostActionSelector selector = 1;
  google.protobuf.Struct metadata = 2;
  WorkflowRunTrigger trigger = 3;
  repeated WorkflowSignal signals = 4;

  oneof action {
    WorkflowPluginActionPayload plugin = 10;
    WorkflowAgentTurnPayload agent_turn = 11;
  }
}

message WorkflowActionResult {
  string action_event_id = 1;
  int32 status = 2;
  string body = 3;
  WorkflowOutputSummary output_summary = 4;
  string output_ref = 5;
  WorkflowRunError error = 6;
}

message ManagedWorkflowDeployment {
  string provider_name = 1;
  WorkflowDeployment deployment = 2;
}

message ManagedWorkflowRun {
  string provider_name = 1;
  WorkflowRun run = 2;
}

message ManagedWorkflowRunSignal {
  string provider_name = 1;
  WorkflowRun run = 2;
  WorkflowSignal signal = 3;
  bool started_run = 4;
  string workflow_key = 5;
}

message WorkflowManagerPlanDeploymentRequest {
  string provider_name = 1;
  WorkflowDeploymentSpec spec = 2;
  string invocation_token = 3;
  string idempotency_key = 4;
}

message WorkflowManagerApplyDeploymentRequest {
  string provider_name = 1;
  WorkflowDeploymentSpec spec = 2;
  string invocation_token = 3;
  string idempotency_key = 4;
}

message WorkflowManagerGetDeploymentRequest {
  string deployment_id = 1;
  string invocation_token = 2;
}

message WorkflowManagerListDeploymentsRequest {
  string provider_name = 1;
  string invocation_token = 2;
}

message WorkflowManagerListDeploymentsResponse {
  repeated ManagedWorkflowDeployment deployments = 1;
}

message WorkflowManagerDeleteDeploymentRequest {
  string deployment_id = 1;
  int64 generation = 2;
  string invocation_token = 3;
}

message WorkflowManagerSetDeploymentPausedRequest {
  string deployment_id = 1;
  bool paused = 2;
  string invocation_token = 3;
}

message WorkflowManagerSetActivationPausedRequest {
  string deployment_id = 1;
  string activation_id = 2;
  bool paused = 3;
  string invocation_token = 4;
}

message WorkflowManagerStartRunRequest {
  string provider_name = 1;
  string deployment_id = 2;
  int64 deployment_generation = 3;
  string activation_id = 4;
  string workflow_key = 5;
  google.protobuf.Struct input = 6;
  string idempotency_key = 7;
  string invocation_token = 8;
}

message WorkflowManagerSignalRunRequest {
  string run_id = 1;
  WorkflowSignal signal = 2;
  string invocation_token = 3;
}

message WorkflowManagerSignalOrStartRunRequest {
  string provider_name = 1;
  string deployment_id = 2;
  int64 deployment_generation = 3;
  string activation_id = 4;
  string workflow_key = 5;
  google.protobuf.Struct input = 6;
  string idempotency_key = 7;
  WorkflowSignal signal = 8;
  string invocation_token = 9;
}

message WorkflowManagerCancelRunRequest {
  string run_id = 1;
  string reason = 2;
  string invocation_token = 3;
}

message WorkflowManagerDeliverEventRequest {
  string provider_name = 1;
  WorkflowEvent event = 2;
  string invocation_token = 3;
  string idempotency_key = 4;
}

message WorkflowManagerDeliverEventResponse {
  repeated WorkflowEventDeliveryResult results = 1;
}

service WorkflowProvider {
  rpc PlanWorkflow(PlanWorkflowRequest) returns (PlanWorkflowResponse);

  rpc ApplyWorkflowDeployment(ApplyWorkflowDeploymentRequest) returns (WorkflowDeployment);
  rpc GetWorkflowDeployment(GetWorkflowDeploymentRequest) returns (WorkflowDeployment);
  rpc ListWorkflowDeployments(ListWorkflowDeploymentsRequest) returns (ListWorkflowDeploymentsResponse);
  rpc DeleteWorkflowDeployment(DeleteWorkflowDeploymentRequest) returns (google.protobuf.Empty);
  rpc SetWorkflowDeploymentPaused(SetWorkflowDeploymentPausedRequest) returns (WorkflowDeployment);
  rpc SetWorkflowActivationPaused(SetWorkflowActivationPausedRequest) returns (WorkflowDeployment);

  rpc StartWorkflowRun(StartWorkflowRunRequest) returns (WorkflowRun);
  rpc SignalWorkflowRun(SignalWorkflowRunRequest) returns (WorkflowRunSignal);
  rpc SignalOrStartWorkflowRun(SignalOrStartWorkflowRunRequest) returns (WorkflowRunSignal);
  rpc CancelWorkflowRun(CancelWorkflowRunRequest) returns (WorkflowRun);

  rpc DeliverWorkflowEvent(DeliverWorkflowEventRequest) returns (DeliverWorkflowEventResponse);

  rpc GetWorkflowRun(GetWorkflowRunRequest) returns (WorkflowRun);
  rpc ListWorkflowRuns(ListWorkflowRunsRequest) returns (ListWorkflowRunsResponse);
  rpc GetWorkflowRunEvents(GetWorkflowRunEventsRequest) returns (ListWorkflowRunEventsResponse);
  rpc GetWorkflowRunOutput(GetWorkflowRunOutputRequest) returns (WorkflowRunOutput);

  rpc PutExecutionReference(PutWorkflowExecutionReferenceRequest) returns (WorkflowExecutionReference);
  rpc GetExecutionReference(GetWorkflowExecutionReferenceRequest) returns (WorkflowExecutionReference);
  rpc ListExecutionReferences(ListWorkflowExecutionReferencesRequest) returns (ListWorkflowExecutionReferencesResponse);
}

service WorkflowHost {
  rpc InvokeWorkflowAction(InvokeWorkflowActionRequest) returns (WorkflowActionResult);
}

service WorkflowManagerHost {
  rpc PlanDeployment(WorkflowManagerPlanDeploymentRequest) returns (PlanWorkflowResponse);
  rpc ApplyDeployment(WorkflowManagerApplyDeploymentRequest) returns (ManagedWorkflowDeployment);
  rpc GetDeployment(WorkflowManagerGetDeploymentRequest) returns (ManagedWorkflowDeployment);
  rpc ListDeployments(WorkflowManagerListDeploymentsRequest) returns (WorkflowManagerListDeploymentsResponse);
  rpc DeleteDeployment(WorkflowManagerDeleteDeploymentRequest) returns (google.protobuf.Empty);
  rpc SetDeploymentPaused(WorkflowManagerSetDeploymentPausedRequest) returns (ManagedWorkflowDeployment);
  rpc SetActivationPaused(WorkflowManagerSetActivationPausedRequest) returns (ManagedWorkflowDeployment);

  rpc StartRun(WorkflowManagerStartRunRequest) returns (ManagedWorkflowRun);
  rpc SignalRun(WorkflowManagerSignalRunRequest) returns (ManagedWorkflowRunSignal);
  rpc SignalOrStartRun(WorkflowManagerSignalOrStartRunRequest) returns (ManagedWorkflowRunSignal);
  rpc CancelRun(WorkflowManagerCancelRunRequest) returns (ManagedWorkflowRun);
  rpc DeliverEvent(WorkflowManagerDeliverEventRequest) returns (WorkflowManagerDeliverEventResponse);
}
