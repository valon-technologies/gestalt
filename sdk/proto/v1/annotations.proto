syntax = "proto3";

package gestalt.provider.v1;

import "google/protobuf/descriptor.proto";

// SDK annotations: a closed vocabulary of options that move API conventions
// out of comments and into the schema, so sdkgen can generate ergonomic
// surfaces once for every language. Each annotation is validated during
// generation; naming a missing field or annotating the wrong shape fails
// with a diagnostic. See the sdkgen RFC's SDK Annotations section.

// OptionalResult declares that `value` is meaningful only when the bool
// `guard` field is true. At API boundaries the message collapses to an
// optional value (TypeScript `T | undefined`, Python `T | None`, Go
// `(T, bool)`, Rust `Option<T>`).
message OptionalResult {
  string guard = 1;
  string value = 2;
}

// Keyed declares that the repeated `entries` field is a collection keyed by
// each entry's `key` field; entries whose bool `present` field is false are
// omitted. At API boundaries the message collapses to a native map from key
// to the entry's `value` field.
message Keyed {
  string entries = 1;
  string key = 2;
  string present = 3;
  string value = 4;
}

// Framing declares a header-then-payload stream protocol over a frame
// message with a oneof: the first frame always carries `header`, and every
// later frame carries `chunk`. Generated surfaces expose the header and a
// native payload stream instead of raw frames.
message Framing {
  string header = 1;
  string chunk = 2;
}

// JsonResult declares that a unary method's HTTP-shaped result carries the
// standard JSON operation envelope in its body: success envelopes return
// their data, error envelopes and HTTP-error statuses raise the canonical
// invoke error, and any other JSON body passes through unchanged. `status`
// and `body` name the output message's int32 status and bytes payload
// fields. The faithful result stays reachable on the Raw surface.
message JsonResult {
  string status = 1;
  string body = 2;
}

extend google.protobuf.MethodOptions {
  // Flattened call signature: the named request fields become parameters,
  // in order. Fields with presence must come last and become optional
  // parameters.
  repeated string signature = 50001;

  // Header-frame protocol for the streaming side of this method.
  Framing framing = 50002;

  // JSON operation-envelope decoding for this method's result.
  JsonResult json_result = 50003;
}

extend google.protobuf.MessageOptions {
  OptionalResult optional_result = 50001;
  Keyed keyed = 50002;

  // At API boundaries the message collapses to the named field: a response
  // whose only meaning is one field is returned as that field directly.
  string unwrap = 50003;
}

extend google.protobuf.ServiceOptions {
  // Host-service binding name, enabling a generated zero-configuration
  // constructor for the client.
  string host_binding = 50001;
}
