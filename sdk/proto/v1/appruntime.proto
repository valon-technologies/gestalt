syntax = "proto3";

package gestalt.provider.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "v1/agent.proto";

enum AppRuntimeEgressMode {
  APP_RUNTIME_EGRESS_MODE_UNSPECIFIED = 0;
  APP_RUNTIME_EGRESS_MODE_NONE = 1;
  APP_RUNTIME_EGRESS_MODE_CIDR = 2;
  APP_RUNTIME_EGRESS_MODE_HOSTNAME = 3;
}

message AppRuntimeSupport {
  reserved 2, 4, 5, 6;
  reserved "host_service_access";
  bool can_host_apps = 1;
  AppRuntimeEgressMode egress_mode = 3;
  bool supports_prepare_workspace = 7;
}

message AppRuntimeSession {
  string id = 1;
  string state = 2;
  map<string, string> metadata = 3;
  AppRuntimeSessionLifecycle lifecycle = 4;
  string state_reason = 5;
  string state_message = 6;
}

message AppRuntimeSessionLifecycle {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp recommended_drain_at = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message AppRuntimeImagePullAuth {
  string docker_config_json = 1;
}

message StartAppRuntimeSessionRequest {
  reserved 5;
  reserved "image_pull_credentials";
  string app_name = 1;
  string template = 2;
  string image = 3;
  map<string, string> metadata = 4;
  AppRuntimeImagePullAuth image_pull_auth = 6;
}

message GetAppRuntimeSessionRequest {
  string session_id = 1;
}

message ListAppRuntimeSessionsRequest {}

message ListAppRuntimeSessionsResponse {
  repeated AppRuntimeSession sessions = 1;
}

message StopAppRuntimeSessionRequest {
  string session_id = 1;
}

message PrepareAppRuntimeWorkspaceRequest {
  string session_id = 1;
  string agent_session_id = 2;
  AgentWorkspace workspace = 3;
}

message PrepareAppRuntimeWorkspaceResponse {
  PreparedAgentWorkspace workspace = 1;
}

message RemoveAppRuntimeWorkspaceRequest {
  string session_id = 1;
  string agent_session_id = 2;
}

// StartHostedAppRequest describes the app process to launch inside a
// runtime session. The runtime backend owns allocation and injection of the
// plugin's listener endpoint and returns a host-reachable dial target in the
// HostedApp response.
message StartHostedAppRequest {
  reserved 6, 10;
  string session_id = 1;
  string app_name = 2;
  string command = 3;
  repeated string args = 4;
  map<string, string> env = 5;
  repeated string allowed_hosts = 7;
  string default_action = 8;
  string host_binary = 9;
  string workdir = 11;
}

message HostedApp {
  string id = 1;
  string session_id = 2;
  string app_name = 3;
  string dial_target = 4;
}

enum AppRuntimeLogStream {
  PLUGIN_RUNTIME_LOG_STREAM_UNSPECIFIED = 0;
  PLUGIN_RUNTIME_LOG_STREAM_STDOUT = 1;
  PLUGIN_RUNTIME_LOG_STREAM_STDERR = 2;
  PLUGIN_RUNTIME_LOG_STREAM_RUNTIME = 3;
}

message AppRuntimeLogEntry {
  AppRuntimeLogStream stream = 1;
  string message = 2;
  google.protobuf.Timestamp observed_at = 3;
  int64 source_seq = 4;
}

message AppendAppRuntimeLogsRequest {
  string session_id = 1;
  repeated AppRuntimeLogEntry logs = 2;
}

message AppendAppRuntimeLogsResponse {
  int64 last_seq = 1;
}

service AppRuntimeLogHost {
  rpc AppendLogs(AppendAppRuntimeLogsRequest) returns (AppendAppRuntimeLogsResponse);
}

service AppRuntimeProvider {
  rpc GetSupport(google.protobuf.Empty) returns (AppRuntimeSupport);
  rpc StartSession(StartAppRuntimeSessionRequest) returns (AppRuntimeSession);
  rpc GetSession(GetAppRuntimeSessionRequest) returns (AppRuntimeSession);
  rpc ListSessions(ListAppRuntimeSessionsRequest) returns (ListAppRuntimeSessionsResponse);
  rpc StopSession(StopAppRuntimeSessionRequest) returns (google.protobuf.Empty);
  rpc PrepareWorkspace(PrepareAppRuntimeWorkspaceRequest) returns (PrepareAppRuntimeWorkspaceResponse);
  rpc RemoveWorkspace(RemoveAppRuntimeWorkspaceRequest) returns (google.protobuf.Empty);
  rpc StartApp(StartHostedAppRequest) returns (HostedApp);
}
