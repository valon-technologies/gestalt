syntax = "proto3";

package gestalt.provider.v1;

import "google/api/annotations.proto";
import "google/api/visibility.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "v1/annotations.proto";

// CatalogParameter describes one input parameter surfaced in the generated
// catalog for an operation.
message CatalogParameter {
  string name = 1;
  string type = 2;
  string description = 3;
  bool required = 4;
  google.protobuf.Value default = 5;
}

// OperationAnnotations carries optional host hints about how an operation
// behaves.
message OperationAnnotations {
  optional bool read_only_hint = 1;
  optional bool idempotent_hint = 2;
  optional bool destructive_hint = 3;
  optional bool open_world_hint = 4;
}

// UnaryResponseSpec describes a unary (fully materialized) operation response.
message UnaryResponseSpec {
  google.protobuf.Struct schema = 1;
}

// StreamResponseSpec describes a streaming operation response. The media type
// names the representation (for example application/x-ndjson); the item schema
// is optional and describes one yielded item when the stream is typed.
message StreamResponseSpec {
  string media_type = 1;
  google.protobuf.Struct item_schema = 2;
}

// OperationResponseSpec declares how an operation responds. App authoring
// defaults to unary; emitted catalogs always declare either unary or stream.
message OperationResponseSpec {
  oneof kind {
    UnaryResponseSpec unary = 1;
    StreamResponseSpec stream = 2;
  }
}

// CatalogOperation is one executable operation exposed by an integration
// provider.
message CatalogOperation {
  string id = 1;
  string method = 2;
  string title = 3;
  string description = 4;
  string input_schema = 5;
  reserved 6;
  reserved "output_schema";
  OperationAnnotations annotations = 7;
  repeated CatalogParameter parameters = 8;
  repeated string required_scopes = 9;
  repeated string tags = 10;
  bool read_only = 11;
  optional bool visible = 12;
  string transport = 13;
  repeated string allowed_roles = 14;
  // Response mode and schema for this operation. Replaces the former
  // output_schema string; absent is equivalent to unary with no schema.
  OperationResponseSpec response = 15;
}

// Catalog is the static or request-scoped executable surface exposed by a
// provider.
message Catalog {
  string name = 1;
  string display_name = 2;
  string description = 3;
  string icon_svg = 4;
  repeated CatalogOperation operations = 5;
}

// ConnectionMode describes which credential sources a provider accepts.
enum ConnectionMode {
  CONNECTION_MODE_UNSPECIFIED = 0;
  CONNECTION_MODE_NONE = 1;
  CONNECTION_MODE_SUBJECT = 2;
}

// ConnectionParamDef describes one provider-defined connection parameter.
message ConnectionParamDef {
  bool required = 1;
  string description = 2;
  string default_value = 3;
  string from = 4;
  string field = 5;
}

// ProviderMetadata describes an integration provider's static capabilities.
message ProviderMetadata {
  string name = 1;
  string display_name = 2;
  string description = 3;
  ConnectionMode connection_mode = 4;
  repeated string auth_types = 5;
  map<string, ConnectionParamDef> connection_params = 6;
  Catalog static_catalog = 7;
  bool supports_session_catalog = 8;
  int32 min_protocol_version = 11;
  int32 max_protocol_version = 12;
  // Workflow definitions this app declares as desired state. Each entry is a
  // serialized gestalt.provider.v1.WorkflowDefinitionSpec (workflow.proto).
  // Framed as bytes because workflow.proto imports app.proto, so this file
  // cannot reference WorkflowDefinitionSpec directly. The spec `id` is the
  // app-local id; stored ids look like app_notes_daily-summary (app name + local id)
  // and are applied with gestaltd authority on the config-definitions reconcile path.
  repeated bytes workflow_definition_specs = 13;
}

// OperationResult is the serialized result returned from an Execute call.
message OperationResult {
  int32 status = 1;
  bytes body = 2;
  map<string, StringList> headers = 3;
}

// InvokeMetadata is the first frame of a streaming invocation. It carries the
// HTTP-shaped status, headers, and the response media type (from the
// operation's StreamResponseSpec).
message InvokeMetadata {
  int32 status = 1;
  map<string, StringList> headers = 2;
  string media_type = 3;
}

// InvokeFrame is one frame in a streaming invocation. The first frame is always
// metadata; subsequent frames carry data bytes produced by the operation
// handler (after encoding, for typed item streams). A mid-stream error (for
// example, a validation failure or a recovered panic) may emit a trailing
// metadata frame with a non-2xx status followed by a data frame carrying a
// JSON error body, after which the stream ends.
message InvokeFrame {
  oneof value {
    InvokeMetadata metadata = 1;
    bytes data = 2;
  }
}

// AppInvokeRequest invokes a declared operation on another app through Gestalt.
message AppInvokeRequest {
  reserved 7, 10;
  reserved "workflow";

  string app = 2;
  string operation = 3;
  google.protobuf.Struct params = 4;
  string connection = 5;
  string instance = 6;
  string idempotency_key = 8;
  string credential_mode = 9;
  RequestContext context = 11;
  SubjectContext run_as = 12;
  reserved 13;
  reserved "delegated_caller_proof";
}

// AppInvokeGraphQLRequest invokes the raw GraphQL surface on another plugin
// through Gestalt.
message AppInvokeGraphQLRequest {
  reserved 6;

  string app = 1;
  string document = 2;
  google.protobuf.Struct variables = 3;
  string connection = 4;
  string instance = 5;
  string idempotency_key = 7;
  RequestContext context = 8;
  reserved 9;
  reserved "delegated_caller_proof";
}

// SubjectContext identifies the caller that initiated an operation.
message SubjectContext {
  reserved 2;
  string id = 1;
  string email = 3;
  string display_name = 4;
  repeated string scopes = 5;
  repeated SubjectPermissionContext permissions = 6;
}

message SubjectPermissionContext {
  string app = 1;
  repeated string operations = 2;
  bool all_operations = 3;
}

message AgentToolRef {
  string app = 1;
  string operation = 2;
  string connection = 3;
  string instance = 4;
  string title = 5;
  string description = 6;
  string credential_mode = 7;
  string system = 8;
  SubjectContext run_as = 9;
}

// StringList is a helper map value for repeated HTTP header and query values.
message StringList {
  repeated string values = 1;
}

// CredentialContext describes the resolved credential used for an operation.
message CredentialContext {
  string mode = 1;
  string subject_id = 2;
  string connection = 3;
  string instance = 4;
}

// AccessContext describes the host-side access decision for an operation.
message AccessContext {
  string policy = 1;
  string role = 2;
}

// HostContext describes stable public host metadata available to provider code.
message HostContext {
  string public_base_url = 1;
}

// ProviderContext identifies the provider process that received the request
// context from the host and is trusted to propagate it back to host services.
message ProviderContext {
  string kind = 1;
  string name = 2;
}

message InvocationContext {
  string request_id = 1;
  int32 depth = 2;
  repeated string call_chain = 3;
  string surface = 4;
  bool internal_connection_access = 5;
  string connection = 6;
}

message RequestMetaContext {
  string client_ip = 1;
  string remote_addr = 2;
  string user_agent = 3;
}

message AgentInvocationContext {
  string provider_name = 1;
  string session_id = 2;
  string turn_id = 3;
}

// RequestContext bundles the caller, credential, access, and host metadata for
// one operation.
message RequestContext {
  SubjectContext subject = 1;
  CredentialContext credential = 2;
  AccessContext access = 3;
  google.protobuf.Struct workflow = 4;
  HostContext host = 5;
  // Original agent caller when an agent tool executes with delegated run-as identity.
  SubjectContext agent_subject = 6;
  ProviderContext caller = 7;
  InvocationContext invocation = 8;
  // Agent tool refs granted to the operation request, when the request is
  // executing as an agent tool.
  repeated AgentToolRef tool_refs = 9;
  // Preserves the distinction between an omitted tool-ref context and an
  // explicitly empty inherited tool-ref context.
  bool tool_refs_set = 10;
  RequestMetaContext request_meta = 11;
  AgentInvocationContext agent = 12;
}

// HTTPSubjectRequest carries one verified hosted HTTP request into an optional
// plugin-local subject resolution hook.
message HTTPSubjectRequest {
  string binding = 1;
  string method = 2;
  string path = 3;
  string content_type = 4;
  map<string, StringList> headers = 5;
  map<string, StringList> query = 6;
  google.protobuf.Struct params = 7;
  bytes raw_body = 8;
  string security_scheme = 9;
  string verified_subject = 10;
  map<string, string> verified_claims = 11;
}

// ResolveHTTPSubjectRequest asks a provider to map a verified hosted HTTP
// request to a concrete Gestalt subject before normal operation authorization
// and dispatch.
message ResolveHTTPSubjectRequest {
  HTTPSubjectRequest request = 1;
  RequestContext context = 2;
}

// ResolveHTTPSubjectResponse returns the concrete Gestalt subject a hosted HTTP
// request should execute as. An unset subject means "fall back to the binding
// subject". When reject_status is set, the host should reject the inbound
// request with the provided status and message.
message ResolveHTTPSubjectResponse {
  SubjectContext subject = 1;
  int32 reject_status = 2;
  string reject_message = 3;
}

// ExecuteRequest invokes one executable operation.
message ExecuteRequest {
  reserved 8;
  reserved "invocation_token";

  string operation = 1;
  google.protobuf.Struct params = 2;
  string token = 3;
  map<string, string> connection_params = 4;
  string invocation_id = 5;
  RequestContext context = 6;
  string idempotency_key = 9;
  reserved 11;
  reserved "caller_proof";
}

// GetSessionCatalogRequest asks a provider for request-scoped catalog
// extensions.
message GetSessionCatalogRequest {
  string token = 1;
  map<string, string> connection_params = 2;
  string invocation_id = 3;
  RequestContext context = 4;
}

// GetSessionCatalogResponse returns request-scoped catalog extensions.
message GetSessionCatalogResponse {
  Catalog catalog = 1;
}

// StartProviderRequest configures an integration provider for one runtime
// session.
message StartProviderRequest {
  string name = 1;
  google.protobuf.Struct config = 2;
  int32 protocol_version = 4;
}

// StartProviderResponse confirms the protocol version the provider is serving.
message StartProviderResponse {
  int32 protocol_version = 1;
}

// AppProvider models the shared Gestalt integration-provider protocol.
service AppProvider {
  rpc GetMetadata(google.protobuf.Empty) returns (ProviderMetadata);
  rpc StartProvider(StartProviderRequest) returns (StartProviderResponse) {
    option (signature) = "name";
    option (signature) = "protocol_version";
    option (signature) = "config";
  }
  rpc Execute(ExecuteRequest) returns (OperationResult) {
    option (signature) = "operation";
    option (signature) = "token";
    option (signature) = "invocation_id";
    option (signature) = "idempotency_key";
    option (signature) = "params";
  }
  // ExecuteStream is the streaming counterpart of Execute. The first response
  // frame is always InvokeMetadata; subsequent frames carry encoded data bytes.
  // A mid-stream error may emit a trailing metadata frame with an error status
  // followed by a JSON error body, after which the stream ends.
  rpc ExecuteStream(ExecuteRequest) returns (stream InvokeFrame) {
    option (signature) = "operation";
    option (signature) = "token";
    option (signature) = "invocation_id";
    option (signature) = "idempotency_key";
    option (signature) = "params";
  }
  rpc ResolveHTTPSubject(ResolveHTTPSubjectRequest) returns (ResolveHTTPSubjectResponse);
  rpc GetSessionCatalog(GetSessionCatalogRequest) returns (GetSessionCatalogResponse) {
    option (signature) = "token";
    option (signature) = "invocation_id";
  }
}

service App {
  option (host_binding) = "app";

  rpc Invoke(AppInvokeRequest) returns (OperationResult) {
    option (google.api.http) = {
      post: "/api/v2/app/{app}/operations/{operation}"
      body: "*"
    };
    option (google.api.method_visibility) = {
      restriction: "PUBLIC"
    };
    option (public) = {
      fill: "context"
      reject: "run_as"
    };
    option (json_result) = {
      status: "status"
      body: "body"
    };
    option (signature) = "app";
    option (signature) = "operation";
    option (signature) = "params";
    option (optional_signature) = "connection";
    option (optional_signature) = "instance";
    option (optional_signature) = "idempotency_key";
    option (optional_signature) = "credential_mode";
    option (optional_signature) = "run_as";
  }
  // InvokeStream is the streaming counterpart of Invoke. It is gRPC-only (no
  // REST binding) and shares Invoke's request shape, authorization, and
  // signature policy. The first response frame is always InvokeMetadata;
  // subsequent frames carry data bytes from the operation's stream response.
  // A mid-stream error may emit a trailing metadata frame with an error status
  // followed by a JSON error body, after which the stream ends.
  rpc InvokeStream(AppInvokeRequest) returns (stream InvokeFrame) {
    option (google.api.method_visibility) = {
      restriction: "PUBLIC"
    };
    option (public) = {
      fill: "context"
      reject: "run_as"
    };
    option (signature) = "app";
    option (signature) = "operation";
    option (signature) = "params";
    option (optional_signature) = "connection";
    option (optional_signature) = "instance";
    option (optional_signature) = "idempotency_key";
    option (optional_signature) = "credential_mode";
    option (optional_signature) = "run_as";
  }
  rpc InvokeGraphQL(AppInvokeGraphQLRequest) returns (OperationResult) {
    option (google.api.http) = {
      post: "/api/v2/app/{app}/graphql"
      body: "*"
    };
    option (google.api.method_visibility) = {
      restriction: "PUBLIC"
    };
    option (public) = {
      fill: "context"
    };
    option (signature) = "app";
    option (signature) = "document";
    option (optional_signature) = "connection";
    option (optional_signature) = "instance";
    option (optional_signature) = "idempotency_key";
    option (optional_signature) = "variables";
  }
}
