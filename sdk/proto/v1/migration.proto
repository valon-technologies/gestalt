syntax = "proto3";

package gestalt.provider.v1;

import "google/protobuf/struct.proto";
import "v1/annotations.proto";
import "v1/workflow.proto";

// ApplyWorkflowMigrationRequest applies one workflow-definition migration revision
// on behalf of a configuring app provider. Only callable while the caller is in
// the trusted configure/migration phase.
message ApplyWorkflowMigrationRequest {
  // Workflow provider name. Must be explicit; "default" is rejected.
  string provider = 1;
  // Migration revision id recorded in the app ledger after success.
  string revision_id = 2;
  // Raw workflow definition spec materialized by the app migration.
  WorkflowDefinitionSpec spec = 3;
  // Stable idempotency key derived from migration identity and definition fingerprint.
  string idempotency_key = 4;
}

message ApplyWorkflowMigrationResponse {
  option (unwrap) = "definition";

  WorkflowDefinition definition = 1;
}

// Migration is a host service available to provider processes during configure.
service Migration {
  option (host_binding) = "migrations";

  rpc ApplyWorkflowMigration(ApplyWorkflowMigrationRequest) returns (ApplyWorkflowMigrationResponse);
}
