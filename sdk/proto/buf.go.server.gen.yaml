version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package
      value: github.com/valon-technologies/gestalt/server/rpc/protov1/v1;proto
plugins:
  # Go messages
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../../gestaltd/rpc/protov1
    opt:
      - paths=source_relative

  # Go gRPC stubs
  - remote: buf.build/grpc/go:v1.6.2
    out: ../../gestaltd/rpc/protov1
    opt:
      - paths=source_relative

  # Go grpc-gateway REST handlers
  - remote: buf.build/grpc-ecosystem/gateway:v2.28.0
    out: ../../gestaltd/rpc/protov1
    opt:
      - paths=source_relative
      - generate_unbound_methods=false
