version: 1
services:
  - proto: gestalt.provider.v1.AuthorizationProvider
    sdk_name: Authorization
    package:
      typescript: Authorization
      python: authorization
      go: authorization
      rust: authorization
    well_known_types:
      google.protobuf.Struct:
        semantic: json_object
      google.protobuf.Timestamp:
        semantic: timestamp_with_presence
    enum_policy: preserve_unknown_numeric
    oneof_policy: explicit_variants
    outputs:
      typescript:
        - path: sdk/typescript/src/authorization.ts
          template: authorization/typescript/authorization.ts
      python:
        - path: sdk/python/gestalt/authorization.py
          template: authorization/python/authorization.py
      go:
        - path: sdk/go/authorization/doc.go
          template: authorization/go/doc.go.tmpl
        - path: sdk/go/authorization/types.go
          template: authorization/go/types.go.tmpl
        - path: sdk/go/authorization/protocol.go
          template: authorization/go/protocol.go.tmpl
        - path: sdk/go/authorization/conversions.go
          template: authorization/go/conversions.go.tmpl
        - path: sdk/go/authorization/client.go
          template: authorization/go/client.go.tmpl
      rust:
        - path: sdk/rust/src/authorization.rs
          template: authorization/rust/authorization.rs
