[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gestalt-sdk"
version = "0.0.1a2"
description = "Python SDK for Gestalt executable providers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.80.0,<2",
  "googleapis-common-protos>=1.74.0,<2",
  "opentelemetry-api==1.41.1",
  "opentelemetry-sdk==1.41.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.41.1",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "pyyaml==6.0.3",
  "pyinstaller<7",
  "protobuf>=6.33.1,<8",
  "httpx>=0.28.0,<1",
  "typing-extensions==4.12.2",
  "tomli>=2.0.1,<3; python_version < '3.11'",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>1",
  "ruff==0.15.14",
  "sphinx==8.1.3",
  "ty==0.0.38",
  "vulture==2.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["gestalt*"]

[tool.setuptools.package-data]
gestalt = ["py.typed", "_gen/v1/*.pyi"]

[project.urls]
Documentation = "https://gestaltd.ai/api/python/index.html"
Repository = "https://github.com/valon-technologies/gestalt"

[project.scripts]
gestalt = "gestalt._cli:main"

[tool.ruff]
target-version = "py310"
exclude = ["gestalt/_gen"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["gestalt"]

[tool.vulture]
paths = ["gestalt", "scripts", "tests"]
exclude = ["gestalt/_gen/"]
ignore_names = ["indentless"]
min_confidence = 80
